        function makeVdWarnIcon(onRoute, color, manual) {
            const fill = color || VD_WARN_COLOR;
            const svg = '<svg viewBox="0 0 24 24" width="16" height="16">'
                + '<path d="M12 2 L23 21 H1 Z" fill="' + fill + '" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>'
                + '<rect x="10.9" y="9" width="2.2" height="6.2" rx="1.1" fill="#ffffff"/>'
                + '<circle cx="12" cy="17.8" r="1.3" fill="#ffffff"/></svg>';
            const cls = 'vd-warn-icon' + (onRoute ? ' on-route' : '') + (manual ? ' sim' : '');
            return L.divIcon({
                className: cls,
                html: '<div class="vd-warn-box">' + svg + '</div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
        }

        function vdLevelLabel(level) { return VD_LEVEL_LABEL[level] || '—'; }

        function repSpeedForLevel(levels, level) {
            if (Array.isArray(levels)) {
                const lv = levels.find(x => Number(x.Level) === level);
                if (lv) {
                    const lo = (typeof lv.LowValue === 'number') ? lv.LowValue : 0;
                    const top = (typeof lv.TopValue === 'number') ? lv.TopValue : (lo + 12);
                    return Math.round((lo + top) / 2);
                }
            }
            return VD_LEVEL_FALLBACK_SPEED[level] || 0;
        }

        function buildVdPointIndex() {
            const idx = {};
            Object.values(tripStore).forEach(t => {
                if (!t.is_computed || !t.vd_result) return;
                (t.vd_result.points || []).forEach(p => { idx[p.vdid] = p; });
            });
            vdPointIndex = idx;
        }

        function worstColor(a, b) {
            return (VD_COLOR_SEVERITY[b] || 0) > (VD_COLOR_SEVERITY[a] || 0) ? b : a;
        }

        // 有效狀態：即時優先（即時存在時不可被模擬調降），模擬可往上加嚴重度
        function effectiveVd(vdid) {
            const p = vdPointIndex[vdid] || {};
            const levels = p.levels;
            const liveLevel = (p.level != null) ? p.level : null;
            const simLevel = vdManualOverride[vdid];
            if (liveLevel == null && simLevel == null) {
                return { level: null, color: 'GRAY', speed: 0, manual: false };
            }
            let effLevel;
            if (liveLevel == null) effLevel = simLevel;
            else if (simLevel == null) effLevel = liveLevel;
            else effLevel = Math.max(liveLevel, simLevel);

            const manual = (simLevel != null && effLevel === simLevel && (liveLevel == null || simLevel > liveLevel));
            let speed;
            if (liveLevel != null && effLevel === liveLevel) {
                speed = (p.speed != null && p.speed > 0) ? p.speed : repSpeedForLevel(levels, effLevel);
            } else {
                speed = repSpeedForLevel(levels, effLevel);
            }
            const color = { 1: 'GREEN', 2: 'GREEN', 3: 'ORANGE', 4: 'ORANGE', 5: 'RED' }[effLevel] || 'GRAY';
            return { level: effLevel, color: color, speed: speed, manual: manual };
        }

        function isContinuousLeg(covs) {
            const arr = covs.filter(c => c.s_m != null).slice().sort((a, b) => a.s_m - b.s_m);
            if (arr.length < 2) return false;
            for (let i = 1; i < arr.length; i++) {
                const gap = (arr[i].s_m - (arr[i].back_m || 0)) - (arr[i - 1].s_m + (arr[i - 1].fwd_m || 0));
                if (gap > 100) return false;
            }
            return true;
        }

        function applyOverrideScope(vdid, lv) {
            let targetTrip = null, targetLeg = null;
            Object.values(tripStore).forEach(t => {
                if (!t.is_computed || !t.vd_result) return;
                const hit = (t.vd_result.coverage || []).find(c => c.vdid === vdid && c.leg_index != null);
                if (hit) { targetTrip = t; targetLeg = hit.leg_index; }
            });
            let vdids = [vdid];
            if (targetTrip) {
                const legCovs = (targetTrip.vd_result.coverage || []).filter(c => c.leg_index === targetLeg);
                if (isContinuousLeg(legCovs)) vdids = legCovs.map(c => c.vdid);
            }
            vdids.forEach(v => { if (lv === 0) delete vdManualOverride[v]; else vdManualOverride[v] = lv; });
        }

        // 以即時/模擬 VD 速度融合覆蓋段 ETA，並依最嚴重色設定 leg 顏色
        function applyVdEta(trip) {
            if (!trip.route_result || !trip.route_result.legs) return;
            const legs = trip.route_result.legs;
            legs.forEach(l => {
                l.duration_min = (l.base_duration_min != null) ? l.base_duration_min : l.duration_min;
                l.traffic_status = l.base_traffic_status || 'GREEN';
            });
            const coverage = (trip.vd_result && trip.vd_result.coverage) || [];
            const byLeg = {};
            coverage.forEach(cov => {
                if (cov.leg_index == null || cov.s_m == null) return;
                if (trip.appliedReroutes && trip.appliedReroutes[cov.leg_index]) return; // 已改道 leg 不套用原路壅塞融合
                const slot = byLeg[cov.leg_index] = byLeg[cov.leg_index] || { intervals: [], worst: 'GRAY' };
                const eff = effectiveVd(cov.vdid);
                if (!eff.speed || eff.speed <= 0) return;
                slot.intervals.push({
                    a: cov.s_m - (cov.back_m || 0),
                    b: cov.s_m + (cov.fwd_m || 0),
                    speed: Math.min(eff.speed, 90)
                });
                slot.worst = worstColor(slot.worst, eff.color);
            });
            Object.keys(byLeg).forEach(li => {
                const leg = legs[Number(li)];
                if (!leg) return;
                const slot = byLeg[li];
                leg.traffic_status = slot.worst || 'GRAY';
                if (!slot.intervals.length) return;
                const baseS = (leg.base_duration_min != null ? leg.base_duration_min : leg.duration_min) * 60;
                const distM = leg.distance_km * 1000;
                if (baseS <= 0 || distM <= 0) return;
                const nomSpeed = distM / baseS;
                const iv = slot.intervals.sort((x, y) => x.a - y.a);
                const merged = [];
                iv.forEach(x => {
                    const m = merged[merged.length - 1];
                    if (m && x.a <= m.b) { m.b = Math.max(m.b, x.b); m.speed = Math.min(m.speed, x.speed); }
                    else merged.push({ a: x.a, b: x.b, speed: x.speed });
                });
                let adjS = 0;
                merged.forEach(m => {
                    const d = Math.max(0, m.b - m.a);
                    const vs = m.speed / 3.6;
                    if (vs > 0) adjS += d / vs - d / nomSpeed;
                });
                leg.duration_min = Math.max(0.1, Math.round(((baseS + adjS) / 60) * 10) / 10);
            });
            trip.route_result.duration_min = Math.round(legs.reduce((s, l) => s + l.duration_min, 0) * 10) / 10;
        }

        function rerenderVdAndEta() {
            buildVdPointIndex();
            Object.values(tripStore).forEach(t => { if (t.is_computed && t.route_result) { applyVdEta(t); scheduleRerouteScan(t); } });
            renderSidebar();
            renderAllMapLayers();
            renderTimelineView();
        }

        /* ========== 改道系統：掃描/繪製/套用/清除 ========== */
        const rerouteScanTimers = {};
        let rerouteScanPending = 0;

        function updateRerouteScanStatus() {
            const el = document.getElementById('vd-scan-status');
            if (!el) return;
            if (rerouteScanPending > 0) {
                el.textContent = `改道掃描中…(${rerouteScanPending})`;
                el.classList.add('active');
            } else {
                el.textContent = '';
                el.classList.remove('active');
            }
        }

        function pathPointAt(path, cum, d) {
            if (!path || path.length < 2 || !cum || cum.length !== path.length) return null;
            const total = cum[cum.length - 1];
            d = Math.max(0, Math.min(total, d));
            let lo = 0, hi = cum.length - 1;
            while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid - 1; }
            const i = Math.min(lo, path.length - 2);
            const seg = cum[i + 1] - cum[i];
            const t = seg <= 0 ? 0 : (d - cum[i]) / seg;
            return [path[i][0] + (path[i + 1][0] - path[i][0]) * t, path[i][1] + (path[i + 1][1] - path[i][1]) * t];
        }

        function slicePathByMileage(path, cum, d0, d1) {
            if (!path || path.length < 2 || !cum || cum.length !== path.length) return [];
            d0 = Math.max(0, d0);
            d1 = Math.min(cum[cum.length - 1], d1);
            if (d1 <= d0) return [];
            const out = [pathPointAt(path, cum, d0)];
            for (let i = 0; i < path.length; i++) {
                if (cum[i] > d0 && cum[i] < d1) out.push(path[i]);
            }
            out.push(pathPointAt(path, cum, d1));
            return out.filter(Boolean);
        }

        function rebuildPolylineWithReroutes(trip) {
            const orig = trip.originalRoute;
            if (!orig || !orig.polyline || !orig.cum || !orig.cum.length) return null;
            const applied = Object.keys(trip.appliedReroutes || {}).map(k => trip.appliedReroutes[k]).sort((a, b) => a.p1_m - b.p1_m);
            if (!applied.length) return null;
            let path = [];
            let cursor = 0;
            const total = orig.cum[orig.cum.length - 1];
            applied.forEach(ap => {
                path = path.concat(slicePathByMileage(orig.polyline, orig.cum, cursor, ap.p1_m));
                path = path.concat(ap.alt.seg_polyline || []);
                cursor = ap.p2_m;
            });
            path = path.concat(slicePathByMileage(orig.polyline, orig.cum, cursor, total));
            return path.length > 1 ? path : null;
        }

        function scheduleRerouteScan(trip) {
            if (!trip || !trip.is_computed || !trip.route_result || !trip.route_meta) return;
            clearTimeout(rerouteScanTimers[trip.trip_key]);
            rerouteScanTimers[trip.trip_key] = setTimeout(() => { scanReroutesForTrip(trip); }, 500);
        }

        async function scanReroutesForTrip(trip) {
            if (!trip.is_computed || !trip.route_result || !trip.route_meta) return;
            const meta = trip.route_meta;
            if (!meta.cum || meta.cum.length < 2) return;
            buildVdPointIndex();
            const vds = [];
            const seen = new Set();
            (trip.vd_result.coverage || []).forEach(cov => {
                if (seen.has(cov.vdid)) return;
                seen.add(cov.vdid);
                const p = vdPointIndex[cov.vdid];
                const eff = effectiveVd(cov.vdid);
                if (!p || p.lat == null || p.lon == null) return;
                vds.push({ vdid: cov.vdid, lat: p.lat, lon: p.lon, speed: eff.speed || 0 });
            });
            const coverage = [];
            (trip.vd_result.coverage || []).forEach(cov => {
                if (trip.appliedReroutes && trip.appliedReroutes[cov.leg_index]) return;
                const eff = effectiveVd(cov.vdid);
                coverage.push({ vdid: cov.vdid, s_m: cov.s_m, back_m: cov.back_m, fwd_m: cov.fwd_m, leg_index: cov.leg_index, color: eff.color });
            });
            const legs = (trip.route_result.legs || []).map((l, i) => ({
                leg_index: i,
                distance_km: l.distance_km || 0,
                duration_min: l.duration_min || 0,
                base_duration_min: (l.base_duration_min != null) ? l.base_duration_min : l.duration_min
            }));
            rerouteScanPending++;
            updateRerouteScanStatus();
            try {
                const resp = await fetch(`${API_BASE}/api/route/alternatives`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        polyline: (trip.originalRoute && trip.originalRoute.polyline) ? trip.originalRoute.polyline : trip.route_result.polyline,
                        cum: meta.cum,
                        turn_boundaries: meta.turn_boundaries || [],
                        leg_boundaries: meta.leg_boundaries || [],
                        coverage: coverage,
                        vds: vds,
                        counties: (trip.vd_result && trip.vd_result.counties) || [],
                        legs: legs
                    })
                });
                if (!resp.ok) {
                    console.error(`改道查詢失敗: HTTP ${resp.status} (${trip.trip_key})`);
                    return;
                }
                const data = await resp.json();
                trip.rerouteOptions = (data.legs || []).filter(x => !(trip.appliedReroutes && trip.appliedReroutes[x.leg_index]));
                const altCount = (trip.rerouteOptions || []).reduce((s, x) => s + (x.alternatives || []).length, 0);
                console.log(`改道掃描完成 (${trip.trip_key})：${trip.rerouteOptions.length} 條 leg 有建議，共 ${altCount} 條備選`);
                renderAllMapLayers();
                renderTimelineView();
            } catch (err) {
                console.error('改道查詢失敗:', err);
            } finally {
                rerouteScanPending = Math.max(0, rerouteScanPending - 1);
                updateRerouteScanStatus();
            }
        }

        function applyReroute(tripKey, legIndex, altIndex) {
            const trip = tripStore[tripKey];
            if (!trip || !trip.route_result || !trip.rerouteOptions) return;
            const item = trip.rerouteOptions.find(x => x.leg_index === legIndex);
            if (!item) return;
            const alt = (item.alternatives || [])[altIndex];
            if (!alt || !alt.seg_polyline) return;
            if (!trip.originalRoute) {
                trip.originalRoute = {
                    polyline: JSON.parse(JSON.stringify(trip.route_result.polyline || [])),
                    cum: (trip.route_meta && trip.route_meta.cum) ? trip.route_meta.cum.slice() : [],
                    legs: JSON.parse(JSON.stringify(trip.route_result.legs || []))
                };
            }
            trip.appliedReroutes = trip.appliedReroutes || {};
            trip.appliedReroutes[legIndex] = { alt_index: altIndex, alt: alt, p1_m: alt.p1_m, p2_m: alt.p2_m };
            const newPath = rebuildPolylineWithReroutes(trip);
            if (newPath) trip.route_result.polyline = newPath;
            const leg = (trip.route_result.legs || [])[legIndex];
            const origLeg = (trip.originalRoute.legs || [])[legIndex];
            if (leg && origLeg) {
                const origBase = (origLeg.base_duration_min != null) ? origLeg.base_duration_min : origLeg.duration_min;
                leg.base_duration_min = Math.max(0.1, Math.round((origBase - (alt.base_p1p2_min || 0) + (alt.alt_p1p2_min || 0)) * 10) / 10);
                leg.base_traffic_status = 'GREEN';
            }
            applyVdEta(trip);
            trip.rerouteOptions = (trip.rerouteOptions || []).filter(x => x.leg_index !== legIndex);
            renderSidebar();
            renderAllMapLayers();
            renderTimelineView();
            scheduleRerouteScan(trip);
        }

        function clearAllReroutes() {
            let any = false;
            Object.values(tripStore).forEach(trip => {
                if (!trip.originalRoute || !trip.appliedReroutes || !Object.keys(trip.appliedReroutes).length) return;
                any = true;
                trip.route_result.polyline = JSON.parse(JSON.stringify(trip.originalRoute.polyline));
                (trip.originalRoute.legs || []).forEach((ol, i) => {
                    const leg = (trip.route_result.legs || [])[i];
                    if (leg) {
                        leg.base_duration_min = ol.base_duration_min;
                        leg.base_traffic_status = ol.base_traffic_status;
                    }
                });
                trip.appliedReroutes = {};
                applyVdEta(trip);
            });
            if (!any) return;
            renderSidebar();
            renderAllMapLayers();
            renderTimelineView();
            Object.values(tripStore).forEach(t => { if (t.is_computed && t.route_result) scheduleRerouteScan(t); });
        }

        function renderAllMapLayers() {
            Object.keys(tripLayerGroups).forEach(id => {
                map.removeLayer(tripLayerGroups[id]);
                delete tripLayerGroups[id];
            });
            buildVdPointIndex();

            const allBounds = [];
            Object.values(tripStore).forEach(trip => {
                if (!trip.is_visible) return;

                const layerGroup = L.layerGroup().addTo(map);
                tripLayerGroups[trip.trip_key] = layerGroup;

                if (trip.is_computed && trip.route_result) {
                    if (trip.route_result.polyline && trip.route_result.polyline.length > 0) {
                        L.polyline(trip.route_result.polyline, { color: trip.color, weight: 5, opacity: 0.8 })
                            .on('click', (e) => { L.DomEvent.stopPropagation(e); focusTripInTimeline(trip); })
                            .addTo(layerGroup);
                    }

                    // 改道備選路徑（虛線）與 ETA 標示
                    (trip.rerouteOptions || []).forEach(item => {
                        (item.alternatives || []).forEach((alt, ai) => {
                            if (!alt.seg_polyline || alt.seg_polyline.length < 2) return;
                            L.polyline(alt.seg_polyline, {
                                color: '#111111', weight: 5, opacity: 0.65, dashArray: '10,8', className: 'reroute-flow'
                            }).addTo(layerGroup)
                                .bindTooltip(`Leg ${item.leg_index + 1} 備選${ai + 1}：壅塞段原路 ${alt.main_p1p2_min} 分（暢通 ${alt.base_p1p2_min} 分）｜ 備選 ${alt.alt_p1p2_min} 分 ｜ 整趟 ${item.current_eta_min} → ${alt.eta_min} 分`, { sticky: true });
                            const midPt = alt.seg_polyline[Math.floor(alt.seg_polyline.length / 2)];
                            if (midPt) {
                                L.marker(midPt, {
                                    icon: L.divIcon({ className: '', html: `<div class="alt-eta-badge"><span class="alt-eta-dot" style="background:${trip.color};"></span>${alt.main_p1p2_min}分 → ${alt.alt_p1p2_min}分</div>`, iconSize: [120, 18], iconAnchor: [60, 9] }),
                                    interactive: false
                                }).addTo(layerGroup);
                            }
                            if (alt.exit_at) {
                                L.circleMarker(alt.exit_at, { radius: 6, color: '#111111', fillColor: '#ffffff', fillOpacity: 1, weight: 3 })
                                    .bindTooltip('建議提早改道點').addTo(layerGroup);
                            }
                            if (alt.rejoin_at) {
                                L.circleMarker(alt.rejoin_at, { radius: 6, color: '#111111', fillColor: '#666666', fillOpacity: 0.6, weight: 3 })
                                    .bindTooltip('建議回歸點').addTo(layerGroup);
                            }
                        });
                    });
                    if (trip.route_result.sequence) {
                        trip.route_result.sequence.forEach(seqStop => {
                            if (seqStop.type === 'DEPOT') return;
                            const labelText = seqStop.is_merged ? `#${seqStop.seq_no} (${seqStop.merged_count}單)` : `#${seqStop.seq_no}`;
                            const seqLabelIcon = L.divIcon({
                                className: 'stop-label-icon',
                                html: `<span class="stop-seq-label" style="background:${trip.color};">${labelText}</span>`,
                                iconSize: [36, 20],
                                iconAnchor: [18, -6]
                            });
                            L.marker([seqStop.lat, seqStop.lon], { icon: seqLabelIcon })
                                .on('click', (e) => { L.DomEvent.stopPropagation(e); focusTripInTimeline(trip); })
                                .addTo(layerGroup);
                        });
                    }

                    // VD 覆蓋段（偵測器標記改由全域 vdLayerGroup 彙總繪製）
                    if (trip.vd_result) {
                        (trip.vd_result.coverage || []).forEach(cov => {
                            const eff = effectiveVd(cov.vdid);
                            const baseColor = VD_COLORS[eff.color] || VD_COLORS.GRAY;
                            L.polyline(cov.path, {
                                color: baseColor, weight: 8, opacity: 0.85, lineCap: 'round'
                            }).addTo(layerGroup);
                            if (eff.color !== 'GRAY') {
                                L.polyline(cov.path, {
                                    color: VD_COLORS.GRAY, weight: 8, opacity: 0.9,
                                    className: 'vd-flow', lineCap: 'round'
                                }).addTo(layerGroup);
                            }
                        });
                    }
                }

                trip.stops.forEach(stop => {
                    const isCancelled = stop.status === 'CANCELLED';
                    const markerColor = isCancelled ? '#94a3b8' : trip.color;
                    const marker = L.circleMarker([stop.lat, stop.lon], {
                        radius: 6, fillColor: markerColor, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: isCancelled ? 0.3 : 0.9
                    });
                    marker.bindPopup(() => createStopPopupContent(stop, trip));
                    marker.on('click', () => focusTripInTimeline(trip));
                    marker.addTo(layerGroup);
                    allBounds.push([stop.lat, stop.lon]);
                });
            });

            renderVdLayer();

            if (allBounds.length > 0) map.fitBounds(L.latLngBounds(allBounds).pad(0.08));
        }

        function renderVdLayer() {
            vdLayerGroup.clearLayers();
            buildVdPointIndex();
            const byVdid = new Map();
            Object.values(tripStore).forEach(trip => {
                if (!trip.is_computed || !trip.vd_result) return;
                (trip.vd_result.points || []).forEach(pt => {
                    const cur = byVdid.get(pt.vdid);
                    if (cur) {
                        cur.on_route = cur.on_route || pt.on_route;
                        if (cur.levels == null && pt.levels != null) cur.levels = pt.levels;
                    } else {
                        byVdid.set(pt.vdid, Object.assign({}, pt));
                    }
                });
            });

            byVdid.forEach(pt => {
                if (!showUncoveredVd && !pt.on_route) return;
                const eff = effectiveVd(pt.vdid);
                const iconColor = pt.on_route ? (VD_COLORS[eff.color] || VD_COLORS.GRAY)
                    : (pt.speed > 0 ? (VD_COLORS[eff.color] || VD_WARN_COLOR) : VD_WARN_COLOR);
                const speedTxt = (pt.speed != null && pt.speed > 0) ? `${pt.speed} km/h` : '無即時資料';
                const statusTxt = (pt.status === 0 || pt.status === '0') ? '正常' : (pt.status == null ? '無即時資料' : `異常 (${pt.status})`);
                const timeTxt = pt.collect_time ? String(pt.collect_time).replace('T', ' ').slice(0, 19) : '—';
                const routeTxt = pt.on_route ? '是（沿線滾動顯示）' : '否';
                const levelTxt = (eff.level != null) ? `${vdLevelLabel(eff.level)}` : '無資料';
                const simTxt = vdManualOverride[pt.vdid] != null
                    ? `<div class="prop-item">模擬: <b>${vdLevelLabel(vdManualOverride[pt.vdid])}</b>（即時優先）</div>` : '';

                let html = `<div class="stop-popup"><div class="stop-popup-title">VD ${pt.vdid}</div>`
                    + `<div class="prop-item">路段: <b>${pt.road || '未知路段'}</b></div>`
                    + `<div class="prop-item">即時速度: <b>${speedTxt}</b></div>`
                    + `<div class="prop-item">壅塞等級: <b>${levelTxt}</b></div>`
                    + simTxt
                    + `<div class="prop-item">狀態: ${statusTxt}</div>`
                    + `<div class="prop-item">更新時間: ${timeTxt}</div>`
                    + `<div class="prop-item">是否在路線上: ${routeTxt}</div>`;

                if (pt.on_route) {
                    const sim = vdManualOverride[pt.vdid];
                    const labels = ['A', 'B', 'C', 'D', 'E'];
                    const btns = labels.map((lb, i) => {
                        const lv = i + 1;
                        return `<button class="vd-sim-btn${sim === lv ? ' active' : ''}" data-vd="${pt.vdid}" data-lv="${lv}">${lb}</button>`;
                    }).join('');
                    html += `<div class="prop-item" style="margin-top:6px;">模擬壅塞（即時優先）:</div>`
                        + `<div class="vd-sim-row">${btns}<button class="vd-sim-btn" data-vd="${pt.vdid}" data-lv="0">清除</button></div>`;
                }
                html += `</div>`;

                L.marker([pt.lat, pt.lon], { icon: makeVdWarnIcon(pt.on_route, iconColor, eff.manual) })
                    .bindPopup(html)
                    .addTo(vdLayerGroup);
            });
        }

        function createStopPopupContent(stop, currentTrip) {
            const isCancelled = stop.status === 'CANCELLED';
            const dynamicProps = [];
            if (stop.item_name) dynamicProps.push(`<div class="prop-item">品名: <b>${stop.item_name}</b></div>`);
            if (stop.weight_kg) dynamicProps.push(`<div class="prop-item">重量: <b>${stop.weight_kg} kg</b></div>`);
            if (stop.volume_cbm) dynamicProps.push(`<div class="prop-item">材積: <b>${stop.volume_cbm} cbm</b></div>`);

            return `
                <div class="stop-popup">
                    <div class="stop-popup-title" style="color:${currentTrip.color};">${stop.name} (${stop.stop_id})</div>
                    <div class="prop-item">日期: <b>${stop.date}</b> | 車次: <b>${stop.order_id}</b></div>
                    <div class="prop-item">地址: ${stop.address || '無'}</div>
                    ${dynamicProps.join('')}
                </div>
            `;
        }

        /* ========== 綠色框：行程時間系統時序視圖 ========== */
        let timelineSelectedTripKey = '';
        let timelineComputedTrips = [];

        function toggleTripSelectMenu(force) {
            const menu = document.getElementById('timeline-trip-menu');
            if (!menu) return;
            const open = (typeof force === 'boolean') ? force : !menu.classList.contains('open');
            menu.classList.toggle('open', open);
        }

        function selectTimelineTrip(index) {
            const t = timelineComputedTrips[index];
            if (t) timelineSelectedTripKey = t.trip_key;
            toggleTripSelectMenu(false);
            updateTimelineTripOptions();
            renderTimelineView();
        }

        function focusTripInTimeline(trip) {
            if (!trip || !trip.is_computed || !trip.route_result) return;
            switchTab('timeline');
            timelineSelectedTripKey = trip.trip_key;
            toggleTripSelectMenu(false);
            updateTimelineTripOptions();
            renderTimelineView();
        }

        document.addEventListener('click', (e) => {
            const wrap = document.getElementById('timeline-trip-select');
            if (wrap && !wrap.contains(e.target)) toggleTripSelectMenu(false);
        });

        function updateTimelineTripOptions() {
            const menu = document.getElementById('timeline-trip-menu');
            const labelEl = document.getElementById('timeline-trip-label');
            const dotEl = document.getElementById('timeline-trip-dot');
            if (!menu) return;

            timelineComputedTrips = Object.values(tripStore).filter(t => t.is_computed && t.route_result);

            if (timelineComputedTrips.length === 0) {
                timelineSelectedTripKey = '';
                menu.innerHTML = '';
                labelEl.innerText = '尚無已計算車次';
                dotEl.style.background = 'transparent';
                return;
            }

            if (!timelineComputedTrips.some(t => t.trip_key === timelineSelectedTripKey)) {
                timelineSelectedTripKey = timelineComputedTrips[0].trip_key;
            }

            menu.innerHTML = timelineComputedTrips.map((t, i) => {
                const stationCount = t.route_result.sequence ? t.route_result.sequence.length - 1 : 0;
                const active = t.trip_key === timelineSelectedTripKey ? 'active' : '';
                return `<div class="trip-select-option ${active}" onclick="selectTimelineTrip(${i})">
                    <span class="trip-select-dot" style="background:${t.color};"></span>
                    <span class="trip-select-label">[${t.date}] ${t.order_id} (${stationCount} 站)</span>
                </div>`;
            }).join('');

            const cur = tripStore[timelineSelectedTripKey];
            labelEl.innerText = `[${cur.date}] ${cur.order_id} (${cur.route_result.sequence.length - 1} 站)`;
            dotEl.style.background = cur.color;
        }

        function renderTimelineView() {
            const flowContainer = document.getElementById('timeline-flow-list');
            const trip = tripStore[timelineSelectedTripKey];

            if (!trip || !trip.route_result || !trip.route_result.sequence) {
                flowContainer.innerHTML = `
                    <div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 40px;">
                        請先勾選車次並執行計算以產生行程時間鏈
                    </div>
                `;
                return;
            }

            flowContainer.innerHTML = '';
            const seq = trip.route_result.sequence;
            const legs = trip.route_result.legs || [];

            seq.forEach((item, index) => {
                // 1. 站點節點 (圓點)
                const nodeEl = document.createElement('div');
                nodeEl.className = `timeline-node ${item.type === 'DEPOT' ? 'depot' : ''}`;

                if (item.type === 'DEPOT') {
                    nodeEl.innerHTML = `
                        <div class="node-dot" style="background: #dc2626;">起</div>
                        <div class="node-content">
                            <div class="node-title-row">
                                <span class="node-title">出發點：${item.name}</span>
                            </div>
                        </div>
                    `;
                } else {
                    nodeEl.innerHTML = `
                        <div class="node-dot" style="background: ${trip.color};">#${item.seq_no}</div>
                        <div class="node-content">
                            <div class="node-title-row">
                                <span class="node-title">${item.address || '無地址資料'}</span>
                                <span style="display:flex; align-items:center; flex-shrink:0;">
                                    <span class="node-count-badge">${item.merged_count} 站</span>
                                    <button type="button" class="tl-cancel-btn" data-trip="${trip.trip_key}" data-idx="${index}" title="取消此站（整列合併站一併取消）">×</button>
                                </span>
                            </div>
                        </div>
                    `;
                }
                flowContainer.appendChild(nodeEl);

                // 2. 節點間的連接箭頭 (依需求：現階段以綠色為主，預留 orange / red)
                if (index < legs.length) {
                    const leg = legs[index];
                    const arrowEl = document.createElement('div');
                    const statusClass = leg.traffic_status === 'RED' ? 'red'
                        : (leg.traffic_status === 'ORANGE' ? 'orange'
                        : (leg.traffic_status === 'GRAY' ? 'gray' : ''));
                    arrowEl.className = `timeline-arrow-wrap ${statusClass}`.trim();
                    arrowEl.innerHTML = `
                        <div class="timeline-arrow-line"></div>
                        <div class="timeline-arrow-badge">
                            <span>${leg.distance_km} km ｜ 預估時間: ${leg.duration_min} 分鐘</span>
                        </div>
                        <div class="timeline-arrow-head"></div>
                    `;

                    // 改道比較面板
                    const rrItem = (trip.rerouteOptions || []).find(x => x.leg_index === index);
                    const hasSuggestion = !!(rrItem && rrItem.alternatives && rrItem.alternatives.length)
                        && !(trip.appliedReroutes && trip.appliedReroutes[index]);
                    if (hasSuggestion) {
                        // 有建議路徑：原箭頭資訊不變但稍左移，右側併排一條螢光黃改道箭頭
                        const bestAlt = rrItem.alternatives.reduce((a, b) => ((a.eta_min || 0) <= (b.eta_min || 0) ? a : b));
                        const duo = document.createElement('div');
                        duo.className = 'timeline-arrow-duo';
                        arrowEl.classList.add('shifted');
                        duo.appendChild(arrowEl);
                        const rrArrow = document.createElement('div');
                        rrArrow.className = 'timeline-arrow-wrap reroute';
                        rrArrow.innerHTML = `
                            <div class="timeline-arrow-line"></div>
                            <div class="timeline-arrow-badge">
                                <span>壅塞 ${bestAlt.main_p1p2_min} 分 → 建議 ${bestAlt.alt_p1p2_min} 分</span>
                            </div>
                            <div class="timeline-arrow-head"></div>
                        `;
                        duo.appendChild(rrArrow);
                        flowContainer.appendChild(duo);
                    } else {
                        flowContainer.appendChild(arrowEl);
                    }

                    if (rrItem && rrItem.alternatives && rrItem.alternatives.length) {
                        const rrPanel = document.createElement('div');
                        rrPanel.className = 'reroute-panel';
                        let rrHtml = `<div class="reroute-title">建議改道（Leg ${index + 1}）</div>`;
                        rrItem.alternatives.forEach((alt, ai) => {
                            const savedTxt = (alt.saved_min < 0) ? `多 ${Math.abs(alt.saved_min).toFixed(1)} 分` : `省 ${alt.saved_min.toFixed(1)} 分`;
                            rrHtml += `<div class="reroute-row"><span>壅塞原路 ${alt.main_p1p2_min} 分（暢通 ${alt.base_p1p2_min} 分）｜ 備選${ai + 1}: ${alt.alt_p1p2_min} 分（${savedTxt}）｜ 整趟 ${rrItem.current_eta_min} → ${alt.eta_min} 分</span>`
                                + `<button class="reroute-apply-btn" data-trip="${trip.trip_key}" data-leg="${index}" data-alt="${ai}">套用</button></div>`;
                        });
                        rrPanel.innerHTML = rrHtml;
                        flowContainer.appendChild(rrPanel);
                    }
                    if (trip.appliedReroutes && trip.appliedReroutes[index]) {
                        const donePanel = document.createElement('div');
                        donePanel.className = 'reroute-panel';
                        donePanel.innerHTML = `<div class="reroute-title">已套用改道（Leg ${index + 1}，省 ${trip.appliedReroutes[index].alt.saved_min} 分）</div>`;
                        flowContainer.appendChild(donePanel);
                    }
                }
            });
        }

        /* ========== 執行排程與道路車速最佳化 ========== */
        async function optimizeSingleTrip(trip) {
            if (!trip.assigned_depot) return false;
            const activeStops = trip.stops.filter(s => s.status === 'ACTIVE');
            try {
                const payload = { 
                    date: trip.date,
                    order_id: trip.order_id, 
                    depot: trip.assigned_depot, 
                    stops: activeStops 
                };
                const optCtl = new AbortController();
                const optTimer = setTimeout(() => optCtl.abort(), 120000);
                const resp = await fetch(`${API_BASE}/api/optimize-single-trip`, {
                    method: "POST", 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify(payload),
                    signal: optCtl.signal
                });
                clearTimeout(optTimer);

                if (!resp.ok) return false;
                const result = await resp.json();
                trip.route_result = {
                    distance_km: result.total_distance_km, 
                    duration_min: result.estimated_duration_min,
                    polyline: result.polyline, 
                    sequence: result.sequence,
                    legs: result.legs
                };
                (trip.route_result.legs || []).forEach(leg => {
                    leg.base_duration_min = leg.duration_min;
                    leg.base_traffic_status = leg.traffic_status || 'GREEN';
                });
                trip.vd_result = {
                    counties: result.counties, 
                    points: result.vd_points,
                    coverage: result.vd_coverage
                };
                trip.route_meta = result.route_meta || null;
                trip.originalRoute = null;
                trip.appliedReroutes = {};
                trip.rerouteOptions = [];
                trip.is_computed = true;
                applyVdEta(trip);
                scheduleRerouteScan(trip);
                return true;
            } catch (err) { 
                console.error(`車次 ${trip.trip_key} 計算失敗:`, err); 
                return false;
            }
        }

        async function reoptimizeTrip(trip) {
            if (!trip || trip._busy) return;
            trip._busy = true;
            updateCancelledToolbar();
            try {
                await optimizeSingleTrip(trip);
            } finally {
                trip._busy = false;
            }
            try {
                await refreshLiveTraffic(false);
            } catch (e) {
                console.error('刷新即時車流失敗:', e);
            }
            renderSidebar();
            renderAllMapLayers();
            updateTimelineTripOptions();
            renderTimelineView();
            updateCancelledToolbar();
        }

        function cancelSequenceStop(tripKey, seqIdx) {
            const trip = tripStore[tripKey];
            if (!trip || trip._busy || !trip.route_result) return;
            const item = (trip.route_result.sequence || [])[seqIdx];
            if (!item || item.type !== 'STOP') return;
            const ids = new Set((item.orders || []).map(o => o.stop_id));
            if (ids.size === 0 && item.stop_id) ids.add(item.stop_id);
            const n = (trip.stops || []).filter(s => s.status === 'ACTIVE' && ids.has(s.stop_id)).length;
            if (n === 0) return;
            if (!confirm(`取消 ${item.address || item.stop_id}（${n} 個訂單）？將立即重算路徑。`)) return;
            (trip.stops || []).forEach(s => {
                if (s.status === 'ACTIVE' && ids.has(s.stop_id)) s.status = 'CANCELLED';
            });
            reoptimizeTrip(trip);
        }

        function collectCancelledStops() {
            const out = [];
            Object.values(tripStore).forEach(trip => {
                (trip.stops || []).forEach((s, idx) => {
                    if (s.status === 'CANCELLED') out.push({ trip, stop: s, sidx: idx });
                });
            });
            return out;
        }

        function renderCancelledList() {
            const list = document.getElementById('cancelled-stop-list');
            if (!list) return;
            const items = collectCancelledStops();
            if (items.length === 0) {
                list.style.display = 'none';
                list.innerHTML = '';
                return;
            }
            list.innerHTML = items.map(({ trip, stop, sidx }) => `
                <div class="cancelled-stop-row">
                    <div class="cancelled-stop-info">
                        <span class="cancelled-stop-trip">[${trip.date}] ${trip.order_id}</span>
                        <span class="cancelled-stop-name">${stop.name || stop.stop_id}</span>
                    </div>
                    <button type="button" class="restore-stop-btn" data-trip="${trip.trip_key}" data-sidx="${sidx}">恢復</button>
                </div>`).join('');
        }

        function updateCancelledToolbar() {
            const btn = document.getElementById('vd-restore-btn');
            if (!btn) return;
            const items = collectCancelledStops();
            const badge = document.getElementById('vd-restore-count');
            if (badge) badge.textContent = items.length;
            const list = document.getElementById('cancelled-stop-list');
            const open = list && list.style.display !== 'none' && list.style.display !== '';
            btn.disabled = items.length === 0;
            if (open) renderCancelledList();
        }

        function toggleCancelledList() {
            const list = document.getElementById('cancelled-stop-list');
            if (!list) return;
            const open = list.style.display === 'none' || list.style.display === '';
            if (open) {
                renderCancelledList();
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        }

        function restoreStop(tripKey, sidx) {
            const trip = tripStore[tripKey];
            if (!trip || trip._busy) return;
            const stop = (trip.stops || [])[sidx];
            if (!stop || stop.status !== 'CANCELLED') return;
            stop.status = 'ACTIVE';
            reoptimizeTrip(trip);
        }

        async function runQueueOptimization() {
            const selectedTrips = Object.values(tripStore).filter(t => t.is_selected);
            if (selectedTrips.length === 0) return alert("請至少勾選一個車次進行計算！");

            const progressWrap = document.getElementById('progress-bar-wrap');
            const progressBar = document.getElementById('progress-bar');
            const runBtn = document.getElementById('btn-execute');
            const clearBtn = document.getElementById('btn-clear');

            progressWrap.style.display = 'block'; 
            runBtn.disabled = true;
            clearBtn.disabled = true;

            for (let i = 0; i < selectedTrips.length; i++) {
                const trip = selectedTrips[i];
                const activeStops = trip.stops.filter(s => s.status === 'ACTIVE');

                runBtn.innerText = `(${i + 1}/${selectedTrips.length}) 計算 [${trip.date}] ${trip.order_id}...`;
                progressBar.style.width = `${Math.round(((i + 1) / selectedTrips.length) * 100)}%`;

                if (activeStops.length > 0 && trip.assigned_depot) {
                    await optimizeSingleTrip(trip);
                }
                await new Promise(r => setTimeout(r, 120)); 
            }

            runBtn.innerText = "執行計算並輸出";
            runBtn.disabled = false; 
            clearBtn.disabled = false;
            progressWrap.style.display = 'none';
            // 計算完成後重新抓取即時車流（走 60 秒快取，避免 TDX 風暴造成卡頓）
            try {
                await refreshLiveTraffic(false);
            } catch (e) {
                console.error('刷新即時車流失敗:', e);
            }
            renderSidebar();
            renderAllMapLayers();
            updateTimelineTripOptions();
            renderTimelineView();
            alert("所有選取車次路徑與預估時間計算完成！可切換至「行程時間系統」檢視時序流程。");
        }

        /* ========== VD 即時車流：顏色/ETA 同步與每 30 分鐘更新 ========== */
        function collectActiveCounties() {
            const set = new Set();
            Object.values(tripStore).forEach(t => {
                if (t.is_computed && t.vd_result && Array.isArray(t.vd_result.counties)) {
                    t.vd_result.counties.forEach(c => set.add(c));
                }
            });
            return [...set];
        }

        async function refreshLiveTraffic(force = false) {
            const counties = collectActiveCounties();
            if (counties.length === 0) return;
            let vds = {};
            try {
                const qs = `counties=${encodeURIComponent(counties.join(','))}${force ? '&force=true' : ''}`;
                const liveCtl = new AbortController();
                const liveTimer = setTimeout(() => liveCtl.abort(), 60000);
                const resp = await fetch(`${API_BASE}/api/traffic/live?${qs}`, { signal: liveCtl.signal });
                clearTimeout(liveTimer);
                if (!resp.ok) return;
                const data = await resp.json();
                vds = data.vds || data.data || {};
            } catch (err) {
                console.error('即時車流更新失敗:', err);
                return;
            }

            Object.values(tripStore).forEach(trip => {
                if (!trip.is_computed || !trip.vd_result) return;
                (trip.vd_result.points || []).forEach(pt => {
                    const e = vds[pt.vdid];
                    pt.speed = e ? e.speed : null;
                    pt.color = e ? (e.color || 'GRAY') : 'GRAY';
                    pt.level = e ? e.level : null;
                    pt.level_name = e ? e.level_name : '';
                    pt.levels = e ? e.levels : null;
                    pt.status = e ? e.status : null;
                    pt.collect_time = e ? e.collect_time : null;
                });
                (trip.vd_result.coverage || []).forEach(cov => {
                    const e = vds[cov.vdid];
                    cov.color = e ? (e.color || 'GRAY') : 'GRAY';
                    if (e) {
                        cov.speed = e.speed;
                        cov.level = e.level;
                        cov.collect_time = e.collect_time;
                    }
                });
                applyVdEta(trip);
                if (trip.is_computed && trip.route_result) scheduleRerouteScan(trip);
            });

            renderAllMapLayers();
            renderTimelineView();
        }

        let liveTrafficTimer = null;
        function startLiveTrafficPolling() {
            if (liveTrafficTimer) return;
            liveTrafficTimer = setInterval(refreshLiveTraffic, LIVE_POLL_MS);
        }

        startLiveTrafficPolling();
    </script>
</body>
</html>
