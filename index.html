                    </div>
                </div>
                <div id="timeline-flow-list" class="timeline-flow-list">
                    <div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 40px;">
                        請先勾選車次並執行計算以產生行程時間鏈
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側 Leaflet 地圖 -->
        <div id="map"></div>
    </div>

    <script>
        const COLOR_PALETTE = [
            "#0284c7", "#ea580c", "#16a34a", "#dc2626", "#7c3aed",
            "#0d9488", "#d97706", "#db2777", "#4f46e5", "#ca8a04",
            "#059669", "#65a30d", "#2563eb", "#9333ea", "#c026d3"
        ];

        // VD 車流顏色（與左欄箭頭色票一致）
        const VD_COLORS = { GREEN: '#16a34a', ORANGE: '#ea580c', RED: '#dc2626', GRAY: '#94a3b8' };
        const VD_WARN_COLOR = '#f59e0b';
        const LIVE_POLL_MS = 10 * 60 * 1000; // 每 10 分鐘更新即時車流
        // 官方壅塞等級 1(A)~5(E) 代表速度（無門檻時使用，km/h）
        const VD_LEVEL_FALLBACK_SPEED = { 1: 45, 2: 37, 3: 30, 4: 23, 5: 10 };
        const VD_LEVEL_LABEL = { 1: 'A 順暢', 2: 'B 車多', 3: 'C 壅塞', 4: 'D 嚴重壅塞', 5: 'E 極度壅塞' };
        const REROUTE_REASON_LABEL = {
            WINDOW_TOO_SHORT: '壅塞路徑過短（建議依主線行駛）',
            NO_ALTERNATIVE: '無有效替代道路（周邊無合適繞行幹道）',
            NO_TIME_SAVED: '繞行未達省時門檻（替代路段耗時更長）',
            FAKE_ALTERNATIVE: '無有效避開路線（替代路與原路重疊）',
            REVERTED_ORIGINAL: '候選會繞回已避開的原路（維持目前改道）'
        };

        // 改道類型標示：單點／整合 N 處
        function rerouteTypeLabel(item) {
            return item && item.event_type === 'COMBINED' ? `整合・避開 ${item.covers || 2} 處` : '單點';
        }
        const VD_COLOR_SEVERITY = { GRAY: 0, GREEN: 1, ORANGE: 2, RED: 3 };
        const BEARING_LABEL = { N: '北向', NE: '東北向', E: '東向', SE: '東南向', S: '南向', SW: '西南向', W: '西向', NW: '西北向' };

        let depotStore = []; 
        // API 位址：本機（bat 開啟）走 127.0.0.1:8000；從 ngrok 等外部網址開啟時走同網域相對路徑
        const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://127.0.0.1:8000' : '';

        let tripStore = {};  
        const expandedDates = new Set(); 
        const tripLayerGroups = {}; 
        const vdLayerGroup = L.layerGroup();
        const rerouteArrowLayer = L.layerGroup();  // 改道虛線方向箭頭（縮放時重繪）
        let showUncoveredVd = false; // 是否顯示未覆蓋（不在路線上）的 VD
        const vdManualOverride = {}; // vdid -> 模擬壅塞等級 1~5
        let vdPointIndex = {};       // vdid -> 最新 VD 點資料（含 levels）
        const depotLayer = L.featureGroup();

        const map = L.map('map').setView([24.2, 120.9], 8);
        map.createPane('vdCoveragePane');
        map.getPane('vdCoveragePane').style.zIndex = 450;
        map.createPane('stopMarkerPane');
        map.getPane('stopMarkerPane').style.zIndex = 460;
        // 改道方向箭頭：在改道虛線（400）之上、改道資訊標籤與站點（≥ 460）之下，避免蓋住標籤
        map.createPane('rerouteArrowPane');
        map.getPane('rerouteArrowPane').style.zIndex = 420;
        map.getPane('rerouteArrowPane').style.pointerEvents = 'none';
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        depotLayer.addTo(map);
        vdLayerGroup.addTo(map);
        rerouteArrowLayer.addTo(map);

        function updateMapZoomClass() {
            const z = map.getZoom();
            const container = map.getContainer();
            if (z < 13) {
                container.classList.add('map-zoom-far');
                container.classList.remove('map-zoom-near');
            } else {
                container.classList.add('map-zoom-near');
                container.classList.remove('map-zoom-far');
            }
        }
        map.on('zoomend', updateMapZoomClass);
        updateMapZoomClass();
        map.on('zoomend', () => renderRerouteArrows());

        // 兩點方位角（度，0=北，順時針）
        function bearingDegJs(a, b) {
            const toRad = Math.PI / 180;
            const phi1 = a[0] * toRad, phi2 = b[0] * toRad, dLon = (b[1] - a[1]) * toRad;
            const x = Math.sin(dLon) * Math.cos(phi2);
            const y = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
            return (Math.atan2(x, y) / toRad + 360) % 360;
        }

        function polylineCum(pts) {
            const cum = [0];
            for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + map.distance(pts[i - 1], pts[i]));
            return cum;
        }

        // 沿改道虛線放置方向箭頭：螢幕上約每 90px 一個（每條最多 40 個）
        const REROUTE_ARROW_SPACING_PX = 90;
        const REROUTE_ARROW_MAX = 40;
        function renderRerouteArrows() {
            rerouteArrowLayer.clearLayers();
            const zoom = map.getZoom();
            Object.values(tripStore).forEach(trip => {
                if (!trip.is_computed || !trip.route_result) return;
                (trip.rerouteOptions || []).forEach(item => {
                    (item.alternatives || []).forEach(alt => {
                        const pts = alt.seg_polyline;
                        if (!pts || pts.length < 2 || alt.saved_min < 0.5) return;
                        const cum = polylineCum(pts);
                        const total = cum[cum.length - 1];
                        if (total <= 0) return;
                        const mPerPx = 40075016.686 * Math.cos(pts[0][0] * Math.PI / 180) / Math.pow(2, zoom + 8);
                        const spacing = Math.max(total / REROUTE_ARROW_MAX, REROUTE_ARROW_SPACING_PX * mPerPx);
                        // 避開改道資訊標籤（錨在虛線中點，往右下展開）與改道點／回歸點圓圈
                        const badgePx = map.latLngToLayerPoint(pts[Math.floor(pts.length / 2)]);
                        const dotPx = [alt.exit_at, alt.rejoin_at]
                            .filter(q => q && q.length >= 2).map(q => map.latLngToLayerPoint(q));
                        for (let d = spacing / 2; d < total; d += spacing) {
                            const p = pathPointAt(pts, cum, d);
                            const q0 = pathPointAt(pts, cum, Math.max(0, d - 5));
                            const q1 = pathPointAt(pts, cum, Math.min(total, d + 5));
                            if (!p || !q0 || !q1) continue;
                            const pp = map.latLngToLayerPoint(p);
                            const dx = pp.x - badgePx.x, dy = pp.y - badgePx.y;
                            if (dx > -20 && dx < 170 && dy > -20 && dy < 80) continue;
                            if (dotPx.some(q => Math.hypot(pp.x - q.x, pp.y - q.y) < 18)) continue;
                            const brg = bearingDegJs(q0, q1);
                            const html = `<div class="reroute-arrow" style="transform: rotate(${brg.toFixed(0)}deg);">`
                                + '<svg viewBox="0 0 14 14" width="14" height="14"><path d="M7 1 L12.5 11 L7 8.2 L1.5 11 Z" fill="#111111" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/></svg></div>';
                            L.marker(p, {
                                icon: L.divIcon({ className: 'reroute-arrow-icon', html, iconSize: [14, 14], iconAnchor: [7, 7] }),
                                pane: 'rerouteArrowPane', interactive: false, keyboard: false
                            }).addTo(rerouteArrowLayer);
                        }
                    });
                });
            });
        }

        function toggleAltEtaBadge(el, e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            const container = map.getContainer();
            const isFar = container.classList.contains('map-zoom-far');
            if (isFar) {
                el.classList.toggle('force-expand');
            } else {
                el.classList.toggle('force-collapse');
            }
        }

        const vdToggleControl = L.control({ position: 'topright' });
        vdToggleControl.onAdd = function () {
            const div = L.DomUtil.create('div', 'vd-toggle-panel');
            div.innerHTML = '<label><input type="checkbox" id="vd-toggle-uncovered"' + (showUncoveredVd ? ' checked' : '') + ' /> 顯示未覆蓋 VD</label>'
                + '<div class="vd-toolbar-btns">'
                + '<button type="button" id="vd-clear-sim-btn">清除模擬</button>'
                + '<button type="button" id="vd-clear-reroute-btn">清除改道</button>'
                + '<button type="button" id="vd-restore-btn" disabled>恢復取消點 (<span id="vd-restore-count">0</span>)</button>'
                + '</div>'
                + '<div id="cancelled-stop-list" style="display:none;"></div>'
                + '<div id="vd-scan-status"></div>';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        vdToggleControl.addTo(map);
        updateCancelledToolbar();
        document.addEventListener('change', function (e) {
            if (e.target && e.target.id === 'vd-toggle-uncovered') {
                showUncoveredVd = e.target.checked;
                renderVdLayer();
            }
        });
        document.addEventListener('click', function (e) {
            const t = e.target;
            if (!t || typeof t.getAttribute !== 'function') return;
            if (t.id === 'vd-clear-sim-btn') {
                Object.keys(vdManualOverride).forEach(k => delete vdManualOverride[k]);
                rerenderVdAndEta();
                return;
            }
            if (t.id === 'vd-clear-reroute-btn') {
                clearAllReroutes();
                return;
            }
            if (t.classList && t.classList.contains('reroute-apply-btn')) {
                applyReroute(t.getAttribute('data-trip'), t.getAttribute('data-event'), parseInt(t.getAttribute('data-alt'), 10));
                return;
            }
            if (t.classList && t.classList.contains('tl-cancel-btn')) {
                cancelSequenceStop(t.getAttribute('data-trip'), parseInt(t.getAttribute('data-idx'), 10));
                return;
            }
            if (t.id === 'vd-restore-btn') {
                toggleCancelledList();
                return;
            }
            if (t.classList && t.classList.contains('restore-stop-btn')) {
                restoreStop(t.getAttribute('data-trip'), parseInt(t.getAttribute('data-sidx'), 10));
                return;
            }
            const lvAttr = t.getAttribute('data-lv');
            const vdidAttr = t.getAttribute('data-vd');
            if (lvAttr != null && vdidAttr) {
                applyOverrideScope(vdidAttr, parseInt(lvAttr, 10));
                rerenderVdAndEta();
            }
        });

        const tripListEl = document.getElementById('trip-list');
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const sidebar = document.getElementById('sidebar');

        // 藍色框：漢堡按鈕切換側邊欄收折
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            setTimeout(() => { map.invalidateSize(); }, 350);
        }

        // 紅色框：多層級 Tab 切換
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tabId === 'trips') {
                document.getElementById('tab-btn-trips').classList.add('active');
                document.getElementById('tab-trips-content').style.display = 'flex';
                document.getElementById('tab-timeline-content').style.display = 'none';
            } else {
                document.getElementById('tab-btn-timeline').classList.add('active');
                document.getElementById('tab-trips-content').style.display = 'none';
                document.getElementById('tab-timeline-content').style.display = 'flex';
                updateTimelineTripOptions();
                renderTimelineView();
            }
        }

        tripListEl.addEventListener('scroll', () => {
            if (tripListEl.scrollTop > 150) scrollTopBtn.classList.add('visible');
            else scrollTopBtn.classList.remove('visible');
        });

        function scrollToTop() {
            tripListEl.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('depot-file').addEventListener('change', (e) => handleFileUpload(e, 'DEPOT'));
        document.getElementById('excel-file').addEventListener('change', (e) => handleFileUpload(e, 'STOPS'));

        function handleFileUpload(e, type) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let allRows = [];
                    workbook.SheetNames.forEach(name => {
                        allRows = allRows.concat(XLSX.utils.sheet_to_json(workbook.Sheets[name]));
                    });
                    if (allRows.length === 0) return alert("檔案無有效資料！");

                    if (type === 'DEPOT') parseDepots(allRows);
                    else parseStops(allRows);
                } catch (err) {
                    alert("解析失敗：" + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function classifyCoords(rows, cols) {
            let latCol = null, lonCol = null;
            cols.forEach(col => {
                const lower = col.toLowerCase();
                const sampleVals = rows.slice(0, 30).map(r => parseFloat(r[col])).filter(v => !isNaN(v) && v !== 0);
                if (sampleVals.length === 0) return;
                
                const avg = sampleVals.reduce((a, b) => a + b, 0) / sampleVals.length;
                if (avg > 118 && avg < 123 && (lower.includes('lon') || lower.includes('lng') || lower.includes('x') || lower.includes('經度'))) {
                    lonCol = col;
                } else if (avg > 21 && avg < 26 && (lower.includes('lat') || lower.includes('y') || lower.includes('緯度'))) {
                    latCol = col;
                }
            });
            if (!latCol) latCol = cols.find(c => /lat|緯度|^y$/i.test(c));
            if (!lonCol) lonCol = cols.find(c => /lon|lng|經度|^x$/i.test(c));
            return { latCol, lonCol };
        }

        function parseDepots(rows) {
            const cols = Object.keys(rows[0]);
            const { latCol, lonCol } = classifyCoords(rows, cols);
            if (!latCol || !lonCol) return alert("出發點檔案找不到有效的經緯度欄位！");

            const nameCol = cols.find(c => /名稱|起點|倉庫|站名/i.test(c)) || cols[0];
            const idCol = cols.find(c => /代碼|編號|id/i.test(c)) || nameCol;

            depotStore = rows.map((r, i) => ({
                id: String(r[idCol] || `DEPOT_${i + 1}`),
                name: String(r[nameCol] || `出發站_${i + 1}`),
                lat: parseFloat(r[latCol]),
                lon: parseFloat(r[lonCol])
            })).filter(d => !isNaN(d.lat) && !isNaN(d.lon));

            renderDepots();
            autoAssignDepots();
            renderSidebar();
            checkReadyState();
        }

        function parseStops(rows) {
            const cols = Object.keys(rows[0]);
            const { latCol, lonCol } = classifyCoords(rows, cols);
            if (!latCol || !lonCol) return alert("配送目標檔案找不到有效的經緯度欄位！");

            let dateCol = cols.find(c => /日期|時間|出貨日|date/i.test(c));
            let orderCol = cols.find(c => /組別|派車單號|車次|行程/i.test(c));
            if (!orderCol) orderCol = cols.find(c => /單號/i.test(c)) || '預設車次';
            let stopCol = cols.find(c => /客單編號|出貨單號|站點編號|包裹/i.test(c));
            if (!stopCol && cols.includes('單號') && orderCol !== '單號') stopCol = '單號';
            if (!stopCol) stopCol = cols.find(c => /序號/i.test(c)) || cols[0];

            const nameCol = cols.find(c => /客戶名稱|站點名稱|收件人|名稱|提貨人姓名/i.test(c));
            const addrCol = cols.find(c => /提貨人地址|正規化地址|地址|客戶地址/i.test(c));
            const itemCol = cols.find(c => /貨品名稱|品項|品名|商品|配送物|貨物/i.test(c));
            const weightCol = cols.find(c => /重量|貨重|kg|公斤/i.test(c));
            const volCol = cols.find(c => /總材積|結案材積|材積|cbm|體積/i.test(c));

            tripStore = {};
            let colorIdx = 0;
            const usedCoords = new Set(); 
            expandedDates.clear();

            rows.forEach((r, idx) => {
                let lat = parseFloat(r[latCol]);
                let lon = parseFloat(r[lonCol]);
                if (isNaN(lat) || isNaN(lon) || lat === 0 || lon === 0) return;

                const coordKey = `${lat.toFixed(5)},${lon.toFixed(5)}`;
                if (usedCoords.has(coordKey)) {
                    lat += (Math.random() - 0.5) * 0.0002; 
                    lon += (Math.random() - 0.5) * 0.0002;
                }
                usedCoords.add(`${lat.toFixed(5)},${lon.toFixed(5)}`);

                const dateVal = dateCol && r[dateCol] ? String(r[dateCol]) : '未分類日期';
                const orderId = String(r[orderCol] || '未分類行程');
                const tripKey = `${dateVal}_${orderId}`;

                if (!tripStore[tripKey]) {
                    tripStore[tripKey] = {
                        trip_key: tripKey,
                        date: dateVal,
                        order_id: orderId,
                        color: COLOR_PALETTE[colorIdx % COLOR_PALETTE.length],
                        assigned_depot: null, 
                        stops: [],
                        is_selected: true, 
                        is_visible: true, 
                        is_computed: false,
                        route_result: null
                    };
                    colorIdx++;
                }

                tripStore[tripKey].stops.push({
                    stop_id: String(r[stopCol] || `STOP_${idx + 1}`),
                    trip_key: tripKey,
                    date: dateVal,
                    order_id: orderId, 
                    original_order_id: orderId,
                    name: nameCol && r[nameCol] ? String(r[nameCol]) : `站點_${idx + 1}`,
                    address: addrCol && r[addrCol] ? String(r[addrCol]) : '',
                    lat: lat, lon: lon,
                    item_name: itemCol && r[itemCol] ? String(r[itemCol]) : undefined,
                    weight_kg: weightCol && !isNaN(parseFloat(r[weightCol])) ? parseFloat(r[weightCol]) : undefined,
                    volume_cbm: volCol && !isNaN(parseFloat(r[volCol])) ? parseFloat(r[volCol]) : undefined,
                    status: 'ACTIVE'
                });
            });

            autoAssignDepots();
            renderSidebar();
            renderAllMapLayers();
            checkReadyState();
            updateTimelineTripOptions();
        }

        function autoAssignDepots() {
            if (depotStore.length === 0) return;
            Object.values(tripStore).forEach(trip => {
                if (trip.assigned_depot && trip.assigned_depot.is_manual) return;
                const activeStops = trip.stops.filter(s => s.status === 'ACTIVE');
                if (activeStops.length === 0) return;

                const centerLat = activeStops.reduce((sum, s) => sum + s.lat, 0) / activeStops.length;
                const centerLon = activeStops.reduce((sum, s) => sum + s.lon, 0) / activeStops.length;

                let closestDepot = depotStore[0];
                let minDist = Infinity;
                depotStore.forEach(d => {
                    const dist = Math.hypot(d.lat - centerLat, d.lon - centerLon);
                    if (dist < minDist) { minDist = dist; closestDepot = d; }
                });
                trip.assigned_depot = { ...closestDepot, is_manual: false };
            });
        }

        function renderDepots() {
            depotLayer.clearLayers();
            depotStore.forEach(d => {
                const icon = L.divIcon({
                    className: 'depot-marker',
                    html: `<div style="background:#dc2626; color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; font-size:12px; box-shadow:0 2px 5px rgba(0,0,0,0.3);">起</div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });
                L.marker([d.lat, d.lon], { icon })
                    .bindPopup(`<b>出發點: ${d.name}</b><br>代碼: ${d.id}`)
                    .addTo(depotLayer);
            });
            if (depotStore.length > 0) map.fitBounds(depotLayer.getBounds().pad(0.1));
        }

        /* ========== 紫色框：渲染更詳細的車次卡片 ========== */
        function renderSidebar() {
            const listEl = document.getElementById('trip-list');
            const trips = Object.values(tripStore);

            if (trips.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 40px;">尚未載入單號資料</div>`;
                return;
            }

            const totalStops = trips.reduce((sum, t) => sum + t.stops.length, 0);
            const uniqueDates = new Set(trips.map(t => t.date));
            document.getElementById('summary-meta').innerText = `共 ${uniqueDates.size} 天，${trips.length} 個車次，${totalStops} 個站點`;

            listEl.innerHTML = '';
            const groupedByDate = {};
            trips.forEach(t => {
                if (!groupedByDate[t.date]) groupedByDate[t.date] = [];
                groupedByDate[t.date].push(t);
            });

            Object.keys(groupedByDate).sort().forEach(date => {
                const dateTrips = groupedByDate[date];
                const allSelected = dateTrips.every(t => t.is_selected);
                const someSelected = dateTrips.some(t => t.is_selected);
                const isExpanded = expandedDates.has(date);

                const dateGroup = document.createElement('div');
                dateGroup.className = 'date-group';
                dateGroup.innerHTML = `
                    <div class="date-header" data-date="${date}" onclick="toggleDateCollapse(this.getAttribute('data-date'))">
                        <div class="date-title-group">
                            <input type="checkbox" data-date="${date}" ${allSelected ? 'checked' : ''} 
                                onclick="event.stopPropagation(); toggleDateSelect(this.getAttribute('data-date'), this.checked)" />
                            <span>${date}</span>
                            <span style="font-size:11px; font-weight:normal; color:#64748b; margin-left:4px;">(${dateTrips.length} 車)</span>
                        </div>
                        <span class="toggle-icon ${isExpanded ? '' : 'collapsed'}">▼</span>
                    </div>
                    <div class="date-content ${isExpanded ? '' : 'hidden'}"></div>
                `;

                const dateCheckbox = dateGroup.querySelector('input[type="checkbox"]');
                if (!allSelected && someSelected) dateCheckbox.indeterminate = true;
                const contentEl = dateGroup.querySelector('.date-content');

                dateTrips.forEach(trip => {
                    const activeCount = trip.stops.filter(s => s.status === 'ACTIVE').length;
                    const totalWeight = trip.stops.reduce((sum, s) => sum + (s.status === 'ACTIVE' && s.weight_kg ? s.weight_kg : 0), 0);
                    const totalVol = trip.stops.reduce((sum, s) => sum + (s.status === 'ACTIVE' && s.volume_cbm ? s.volume_cbm : 0), 0);

                    let depotOptions = depotStore.map(d => 
                        `<option value="${d.id}" ${trip.assigned_depot && trip.assigned_depot.id === d.id ? 'selected' : ''}>${d.name}</option>`
                    ).join('');

                    // 紫色框：站點明細 (依地址彙總，重複地址僅顯示一次並標示站數)
                    let stopPool;
                    if (trip.is_computed && trip.route_result && trip.route_result.sequence) {
                        stopPool = trip.route_result.sequence
                            .filter(s => s.type === 'STOP')
                            .map(s => ({ addr: s.address || '無地址', cnt: s.merged_count || 1 }));
                    } else {
                        const addrMap = {};
                        trip.stops.filter(s => s.status === 'ACTIVE').forEach(s => {
                            const key = (s.address || '').trim() || '無地址';
                            if (!addrMap[key]) addrMap[key] = { addr: key, cnt: 0 };
                            addrMap[key].cnt++;
                        });
                        stopPool = Object.values(addrMap);
                    }
                    const stopListHtml = stopPool.map(s =>
                        `<div class="trip-stop-item"><span class="trip-stop-addr">${s.addr}</span><span class="trip-stop-cnt">${s.cnt} 站</span></div>`
                    ).join('');

                    // 紫色框：高度還原簡報中的潔淨樣式 (Icon與並排資訊)
                    const card = document.createElement('div');
                    card.className = 'trip-card';
                    card.innerHTML = `
                        <div class="trip-card-header">
                            <div class="trip-title-group">
                                <input type="checkbox" data-tripkey="${trip.trip_key}" ${trip.is_selected ? 'checked' : ''} 
                                    onchange="toggleTripSelect(this.getAttribute('data-tripkey'), this.checked)" />
                                <div class="trip-color-dot" style="background:${trip.color}"></div>
                                <span class="trip-id">${trip.order_id}</span>
                            </div>
                            <span class="badge-count">${activeCount} 站</span>
                        </div>
                        <div class="trip-stats-box">
                            <div class="trip-stat-item">
                                重量 <b>${totalWeight.toFixed(1)}</b> kg
                            </div>
                            <div class="trip-stat-item">
                                材積 <b>${totalVol.toFixed(2)}</b> cbm
                            </div>
                        </div>
                        <div class="depot-select-row">
                            <span>出發：</span>
                            <select data-tripkey="${trip.trip_key}" onchange="updateTripDepot(this.getAttribute('data-tripkey'), this.value)">
                                ${depotOptions || '<option>無可用起點</option>'}
                            </select>
                        </div>
                        ${stopListHtml ? `<div class="trip-stop-list">${stopListHtml}</div>` : ''}
                        ${trip.is_computed && trip.route_result ? `
                            <div class="trip-time-badge">
                                <span>預估行駛: <b>${trip.route_result.duration_min} 分鐘</b></span>
                                <span>${trip.route_result.distance_km} km</span>
                            </div>
                        ` : ''}
                    `;
                    contentEl.appendChild(card);
                });

                listEl.appendChild(dateGroup);
            });
        }

        function toggleDateCollapse(date) {
            if (expandedDates.has(date)) expandedDates.delete(date);
            else expandedDates.add(date);
            renderSidebar(); 
        }

        function toggleDateSelect(date, checked) {
            Object.values(tripStore).forEach(t => {
                if (t.date === date) { t.is_selected = checked; t.is_visible = checked; }
            });
            renderSidebar();
            renderAllMapLayers();
            updateTimelineTripOptions();
        }

        function toggleSelectAll(select) {
            Object.values(tripStore).forEach(t => { t.is_selected = select; t.is_visible = select; });
            renderSidebar();
            renderAllMapLayers();
            updateTimelineTripOptions();
        }

        function toggleTripSelect(tripKey, checked) {
            if (tripStore[tripKey]) { 
                tripStore[tripKey].is_selected = checked; 
                tripStore[tripKey].is_visible = checked; 
                renderSidebar(); 
                renderAllMapLayers(); 
                updateTimelineTripOptions();
            }
        }

        function updateTripDepot(tripKey, depotId) {
            const depot = depotStore.find(d => d.id === depotId);
            if (depot && tripStore[tripKey]) {
                tripStore[tripKey].assigned_depot = { ...depot, is_manual: true };
                tripStore[tripKey].is_computed = false;
                renderSidebar();
                updateTimelineTripOptions();
            }
        }

        function checkReadyState() {
            const hasData = Object.keys(tripStore).length > 0 && depotStore.length > 0;
            document.getElementById('btn-execute').disabled = !hasData;
            document.getElementById('btn-clear').disabled = !hasData;
        }

        function clearAllRoutes() {
            if (!confirm("確定要清除所有地圖上的計算結果嗎？(不會刪除站點資料)")) return;
            Object.values(tripStore).forEach(trip => {
                trip.is_computed = false;
                trip.route_result = null;
                trip.vd_result = null;
                trip.route_meta = null;
                trip.originalRoute = null;
                trip.appliedReroutes = {};
                trip.replacedSegments = [];
                trip.rerouteOptions = [];
                (trip.stops || []).forEach(s => { s.status = 'ACTIVE'; });
            });
            renderSidebar();
            renderAllMapLayers();
            updateTimelineTripOptions();
            renderTimelineView();
            updateCancelledToolbar();
        }

        function makeVdWarnIcon(onRoute, color, manual) {
            const fill = color || VD_WARN_COLOR;
            const svg = '<svg viewBox="0 0 24 24" width="16" height="16">'
                + '<path d="M12 2 L23 21 H1 Z" fill="' + fill + '" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>'
                + '<rect x="10.9" y="9" width="2.2" height="6.2" rx="1.1" fill="#ffffff"/>'
                + '<circle cx="12" cy="17.8" r="1.3" fill="#ffffff"/></svg>';
            const cls = 'vd-warn-icon' + (onRoute ? ' on-route' : '') + (manual ? ' sim' : '');
            return L.divIcon({
                className: cls,
                html: '<div class="vd-warn-box">' + svg + '</div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
        }

        function vdLevelLabel(level) { return VD_LEVEL_LABEL[level] || '—'; }

        function repSpeedForLevel(levels, level) {
            if (Array.isArray(levels)) {
                const lv = levels.find(x => Number(x.Level) === level);
                if (lv) {
                    const lo = (typeof lv.LowValue === 'number') ? lv.LowValue : 0;
                    const top = (typeof lv.TopValue === 'number') ? lv.TopValue : (lo + 12);
                    return Math.round((lo + top) / 2);
                }
            }
            return VD_LEVEL_FALLBACK_SPEED[level] || 0;
        }

        function buildVdPointIndex() {
            const idx = {};
            Object.values(tripStore).forEach(t => {
                if (!t.is_computed || !t.vd_result) return;
                (t.vd_result.points || []).forEach(p => { idx[p.vdid] = p; });
            });
            vdPointIndex = idx;
        }

        function worstColor(a, b) {
            return (VD_COLOR_SEVERITY[b] || 0) > (VD_COLOR_SEVERITY[a] || 0) ? b : a;
        }

        // 依官方逐路段門檻判定壅塞等級 1~5；無門檻時用 40/20 fallback（與後端 classify_congestion 一致）
        function classifyLevel(speed, levels) {
            if (speed == null || speed <= 0) return null;
            if (Array.isArray(levels) && levels.length) {
                for (const lv of levels) {
                    const lo = (typeof lv.LowValue === 'number') ? lv.LowValue : 0;
                    const top = lv.TopValue;
                    if (speed > lo && (top == null || speed <= Number(top))) {
                        const n = Number(lv.Level);
                        return Number.isFinite(n) ? n : null;
                    }
                }
                return null;
            }
            if (speed > 40) return 1;
            if (speed > 20) return 3;
            return 5;
        }

        function levelColor(level) {
            return { 1: 'GREEN', 2: 'GREEN', 3: 'ORANGE', 4: 'ORANGE', 5: 'RED' }[level] || 'GRAY';
        }

        // 偵測器在指定方向 (linkIds) 的即時讀值：同方向所有車道（車速 > 0）簡單平均；linkIds 空 = 全部方向
        // （與後端 tdx_client.direction_reading 一致）
        function vdReading(p, linkIds) {
            if (!p) return { speed: null, level: null, color: 'GRAY', levels: null, anomaly: '無資料' };
            const links = p.links || null;
            if (!links || !Object.keys(links).length) {
                const spd = (p.speed != null && p.speed > 0) ? p.speed : null;
                return { speed: spd, level: (p.level != null) ? p.level : null, color: p.color || 'GRAY', levels: p.levels || null, anomaly: p.anomaly_reason || null };
            }
            const ids = ((linkIds && linkIds.length) ? linkIds : Object.keys(links)).filter(l => links[l]);
            let levels = null;
            for (const l of ids) { if (links[l].levels) { levels = links[l].levels; break; } }
            if (!levels) levels = p.vd_levels || null;
            if (p.status != null && p.status !== 0 && p.status !== '0') {
                return { speed: null, level: null, color: 'GRAY', levels, anomaly: '設備異常' };
            }
            const lanes = [];
            ids.forEach(l => (links[l].lanes || []).forEach(s => { if (typeof s === 'number' && s > 0) lanes.push(s); }));
            if (!lanes.length) return { speed: null, level: null, color: 'GRAY', levels, anomaly: '無資料' };
            const speed = Math.round(lanes.reduce((a, b) => a + b, 0) / lanes.length * 10) / 10;
            if (speed > 150) return { speed: null, level: null, color: 'GRAY', levels, anomaly: '車速異常' };
            const level = classifyLevel(speed, levels);
            return { speed, level, color: levelColor(level), levels, anomaly: null };
        }

        // 各方向讀值清單（供偵測器彈出視窗顯示）
        function vdDirectionList(p) {
            const links = (p && p.links) || {};
            return Object.keys(links).map(lid => ({ lid, bearing: links[lid].bearing || '', reading: vdReading(p, [lid]) }));
        }

        // 有效狀態：即時優先（即時存在時不可被模擬調降），模擬可往上加嚴重度
        // linkIds：路線行進方向的 LinkID（coverage.dir_links）；省略時用全部方向
        function effectiveVd(vdid, linkIds) {
            const p = vdPointIndex[vdid];
            const base = vdReading(p, linkIds);
            const levels = base.levels;
            const liveLevel = (base.level != null) ? base.level : null;
            const simLevel = vdManualOverride[vdid];
            if (liveLevel == null && simLevel == null) {
                return { level: null, color: 'GRAY', speed: 0, manual: false, anomaly: base.anomaly };
            }
            let effLevel;
            if (liveLevel == null) effLevel = simLevel;
            else if (simLevel == null) effLevel = liveLevel;
            else effLevel = Math.max(liveLevel, simLevel);

            const manual = (simLevel != null && effLevel === simLevel && (liveLevel == null || simLevel > liveLevel));
            let speed;
            if (liveLevel != null && effLevel === liveLevel) {
                speed = (base.speed != null && base.speed > 0) ? base.speed : repSpeedForLevel(levels, effLevel);
            } else {
                speed = repSpeedForLevel(levels, effLevel);
            }
            return { level: effLevel, color: levelColor(effLevel), speed: speed, manual: manual, anomaly: manual ? null : base.anomaly };
        }

        function isContinuousLeg(covs) {
            const arr = covs.filter(c => c.s_m != null).slice().sort((a, b) => a.s_m - b.s_m);
            if (arr.length < 2) return false;
            for (let i = 1; i < arr.length; i++) {
                const gap = (arr[i].s_m - (arr[i].back_m || 0)) - (arr[i - 1].s_m + (arr[i - 1].fwd_m || 0));
                if (gap > 100) return false;
            }
            return true;
        }

        function applyOverrideScope(vdid, lv) {
            let targetTrip = null, targetLeg = null;
            Object.values(tripStore).forEach(t => {
                if (!t.is_computed || !t.vd_result) return;
                const hit = (t.vd_result.coverage || []).find(c => c.vdid === vdid && c.leg_index != null);
                if (hit) { targetTrip = t; targetLeg = hit.leg_index; }
            });
            let vdids = [vdid];
            if (targetTrip) {
                const legCovs = (targetTrip.vd_result.coverage || []).filter(c => c.leg_index === targetLeg);
                if (isContinuousLeg(legCovs)) vdids = legCovs.map(c => c.vdid);
            }
            vdids.forEach(v => { if (lv === 0) delete vdManualOverride[v]; else vdManualOverride[v] = lv; });
        }

        /* ===== 行駛時間計算（與後端 base_time_s / travel_time_s 同一規則） =====
           未被偵測器覆蓋：路名基準速度剖面 speed_segments [起m, 終m, m/s]
           偵測器覆蓋段：改用偵測器車速（下限 8 km/h）；相鄰覆蓋段已於後端在中點平分，不重疊 */
        const TIME_FLOOR_KMH = 8;

        function baseTimeS(segs, d0, d1) {
            if (!(d1 > d0)) return 0;
            if (!segs || !segs.length) return (d1 - d0) / (60 / 3.6);
            let t = 0;
            for (const [a, b, v] of segs) {
                if (b <= d0) continue;
                if (a >= d1) break;
                t += (Math.min(b, d1) - Math.max(a, d0)) / v;
            }
            if (d0 < segs[0][0]) t += (Math.min(d1, segs[0][0]) - d0) / segs[0][2];
            const last = segs[segs.length - 1];
            if (d1 > last[1]) t += (d1 - Math.max(d0, last[1])) / last[2];
            return t;
        }

        function travelTimeS(segs, ivs, d0, d1) {
            let t = baseTimeS(segs, d0, d1);
            ivs.forEach(iv => {
                const aa = Math.max(iv.a, d0), bb = Math.min(iv.b, d1);
                if (bb <= aa) return;
                t += (bb - aa) / (Math.max(iv.speed, TIME_FLOOR_KMH) / 3.6) - baseTimeS(segs, aa, bb);
            });
            return t;
        }

        // 覆蓋段 → 不重疊區間 {a, b, speed, color}（含無效車速者，speed=0）
        function coverageIntervals(trip) {
            const out = [];
            ((trip.vd_result && trip.vd_result.coverage) || []).forEach(cov => {
                if (cov.s_m == null) return;
                const eff = effectiveVd(cov.vdid, cov.dir_links);
                out.push({ a: cov.s_m - (cov.back_m || 0), b: cov.s_m + (cov.fwd_m || 0), speed: eff.speed || 0, color: eff.color });
            });
            out.sort((x, y) => x.a - y.a);
            for (let i = 1; i < out.length; i++) if (out[i].a < out[i - 1].b) out[i].a = out[i - 1].b;
            return out.filter(iv => iv.b > iv.a);
        }

        // 以即時/模擬 VD 速度計算各 leg 行駛時間，並依最嚴重色設定 leg 顏色
        function applyVdEta(trip) {
            if (!trip.route_result || !trip.route_result.legs) return;
            const legs = trip.route_result.legs;
            const meta = trip.route_meta || {};
            const segs = meta.speed_segments || [];
            const bounds = meta.leg_boundaries || [];
            const ivs = coverageIntervals(trip);
            const validIvs = ivs.filter(iv => iv.speed > 0);
            legs.forEach((leg, i) => {
                const base = (leg.base_duration_min != null) ? leg.base_duration_min : leg.duration_min;
                leg.duration_min = base;
                leg.traffic_status = leg.base_traffic_status || 'GREEN';
                if (!segs.length || i >= bounds.length) return;
                const d0 = i > 0 ? bounds[i - 1] : 0;
                const d1 = bounds[i];
                const inLeg = ivs.filter(iv => iv.b > d0 && iv.a < d1);
                if (!inLeg.length) return;
                leg.traffic_status = inLeg.reduce((w, iv) => worstColor(w, iv.color), 'GRAY');
                // 基準時間 + 覆蓋段改用偵測器車速的差額（不重算基準，避免與後端取整差異造成跳動）
                const deltaS = travelTimeS(segs, validIvs, d0, d1) - baseTimeS(segs, d0, d1);
                leg.duration_min = Math.max(0.1, Math.round((base + deltaS / 60) * 10) / 10);
            });
            trip.route_result.duration_min = Math.round(legs.reduce((s, l) => s + l.duration_min, 0) * 10) / 10;
        }

        function rerenderVdAndEta() {
            buildVdPointIndex();
            Object.values(tripStore).forEach(t => { if (t.is_computed && t.route_result) { applyVdEta(t); scheduleRerouteScan(t); } });
            renderSidebar();
            renderAllMapLayers();
            renderTimelineView();
        }

        /* ========== 改道系統：掃描/繪製/套用/清除 ========== */
        const rerouteScanTimers = {};
        let rerouteScanPending = 0;

        function updateRerouteScanStatus() {
            const el = document.getElementById('vd-scan-status');
            if (!el) return;
            if (rerouteScanPending > 0) {
                el.textContent = `改道掃描中…(${rerouteScanPending})`;
                el.classList.add('active');
            } else {
                el.textContent = '';
                el.classList.remove('active');
            }
        }

        function pathPointAt(path, cum, d) {
            if (!path || path.length < 2 || !cum || cum.length !== path.length) return null;
            const total = cum[cum.length - 1];
            d = Math.max(0, Math.min(total, d));
            let lo = 0, hi = cum.length - 1;
            while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid - 1; }
            const i = Math.min(lo, path.length - 2);
            const seg = cum[i + 1] - cum[i];
            const t = seg <= 0 ? 0 : (d - cum[i]) / seg;
            return [path[i][0] + (path[i + 1][0] - path[i][0]) * t, path[i][1] + (path[i + 1][1] - path[i][1]) * t];
        }

        function slicePathByMileage(path, cum, d0, d1) {
            if (!path || path.length < 2 || !cum || cum.length !== path.length) return [];
            d0 = Math.max(0, d0);
            d1 = Math.min(cum[cum.length - 1], d1);
            if (d1 <= d0) return [];
            const out = [pathPointAt(path, cum, d0)];
            for (let i = 0; i < path.length; i++) {
                if (cum[i] > d0 && cum[i] < d1) out.push(path[i]);
            }
            out.push(pathPointAt(path, cum, d1));
            return out.filter(Boolean);
        }

        function scheduleRerouteScan(trip) {
            if (!trip || !trip.is_computed || !trip.route_result || !trip.route_meta) return;
            clearTimeout(rerouteScanTimers[trip.trip_key]);
            rerouteScanTimers[trip.trip_key] = setTimeout(() => { scanReroutesForTrip(trip); }, 500);
        }

        async function scanReroutesForTrip(trip) {
            if (!trip.is_computed || !trip.route_result || !trip.route_meta) return;
            const meta = trip.route_meta;
            if (!meta.cum || meta.cum.length < 2) return;
                        buildVdPointIndex();
            const vds = [];
            const seen = new Set();
            const allPoints = (trip.vd_result && trip.vd_result.points && trip.vd_result.points.length)
                ? trip.vd_result.points
                : Object.values(vdPointIndex);
            allPoints.forEach(p => {
                if (!p || !p.vdid || seen.has(p.vdid)) return;
                seen.add(p.vdid);
                if (p.lat == null || p.lon == null) return;
                const eff = effectiveVd(p.vdid);
                vds.push({
                    vdid: p.vdid,
                    lat: p.lat,
                    lon: p.lon,
                    road: p.road || '',
                    speed: (eff && eff.speed != null) ? eff.speed : (p.speed || 0),
                    color: (eff && eff.color) ? eff.color : (p.color || 'GRAY'),
                    anomaly_reason: (eff && eff.anomaly) ? eff.anomaly : (p.anomaly_reason || null),
                    status: (p.status != null) ? p.status : null,
                    links: p.links || {},
                    vd_levels: p.vd_levels || null,
                    sim_level: (vdManualOverride[p.vdid] != null) ? vdManualOverride[p.vdid] : null
                });
            });
            const coverage = [];
            (trip.vd_result.coverage || []).forEach(cov => {
                const eff = effectiveVd(cov.vdid, cov.dir_links);
                coverage.push({ vdid: cov.vdid, s_m: cov.s_m, back_m: cov.back_m, fwd_m: cov.fwd_m, leg_index: cov.leg_index, color: eff.color, speed: eff.speed || 0 });
            });
            const legs = (trip.route_result.legs || []).map((l, i) => ({
                leg_index: i,
                distance_km: l.distance_km || 0,
                duration_min: l.duration_min || 0,
                base_duration_min: (l.base_duration_min != null) ? l.base_duration_min : l.duration_min
            }));
            rerouteScanPending++;
            updateRerouteScanStatus();
            try {
                const resp = await fetch(`${API_BASE}/api/route/alternatives`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        polyline: trip.route_result.polyline,
                        cum: meta.cum,
                        turn_boundaries: meta.turn_boundaries || [],
                        leg_boundaries: meta.leg_boundaries || [],
                        coverage: coverage,
                        vds: vds,
                        counties: (trip.vd_result && trip.vd_result.counties) || [],
                        legs: legs,
                        speed_segments: meta.speed_segments || [],
                        road_segments: meta.road_segments || [],
                        // 已套用改道所取代的原路段：後端據此剔除繞回原路的候選（顯示「已避開原定路線」）
                        replaced_segments: trip.replacedSegments || []
                    })
                });
                if (!resp.ok) {
                    console.error(`改道查詢失敗: HTTP ${resp.status} (${trip.trip_key})`);
                    return;
                }
                const data = await resp.json();
                trip.rerouteOptions = data.legs || [];
                const withAlts = (trip.rerouteOptions || []).filter(x => x.state === 'CAN_REROUTE' && x.alternatives && x.alternatives.length).length;
                const noAlts = (trip.rerouteOptions || []).filter(x => x.state === 'CANNOT_REROUTE' || !x.alternatives || !x.alternatives.length).length;
                console.log(`改道掃描完成 (${trip.trip_key})：${withAlts} 段有建議省時改道，${noAlts} 段未改道`);
                renderAllMapLayers();
                renderTimelineView();
            } catch (err) {
                console.error('改道查詢失敗:', err);
            } finally {
                rerouteScanPending = Math.max(0, rerouteScanPending - 1);
                updateRerouteScanStatus();
            }
        }

        // 取出 [d0, d1] 範圍內的區間清單 [[a, b, x], ...]，並平移為以 d0 為起點
        function clipShiftSegments(list, d0, d1) {
            const out = [];
            (list || []).forEach(([a, b, x]) => {
                const aa = Math.max(a, d0), bb = Math.min(b, d1);
                if (bb > aa) out.push([aa - d0, bb - d0, x]);
            });
            return out;
        }

        function clipShiftTurns(turns, d0, d1) {
            return (turns || []).filter(t => t > d0 && t < d1).map(t => t - d0);
        }

        async function applyReroute(tripKey, eventId, altIndex) {
            const trip = tripStore[tripKey];
            if (!trip || !trip.route_result || !trip.rerouteOptions) return;
            const item = trip.rerouteOptions.find(x => x.event_id === eventId);
            if (!item) return;
            const alt = (item.alternatives || [])[altIndex];
            if (!alt || !alt.seg_polyline) return;
            const legIndex = item.leg_index;

            // 將替代路段拼接至當前最新生效之路徑中（支援持續接續改道）：原路前段 + 替代路 + 原路後段
            const meta = trip.route_meta || {};
            const currentPath = trip.route_result.polyline;
            const currentCum = meta.cum || [];
            if (!currentPath || currentCum.length !== currentPath.length) {
                console.error('路徑拼接失敗：路線里程資料不一致');
                return;
            }
            const total = currentCum[currentCum.length - 1];
            const p1 = alt.p1_m, p2 = alt.p2_m;
            const pieces = [
                {
                    path: slicePathByMileage(currentPath, currentCum, 0, p1),
                    speed_segments: clipShiftSegments(meta.speed_segments, 0, p1),
                    road_segments: clipShiftSegments(meta.road_segments, 0, p1),
                    turn_boundaries: clipShiftTurns(meta.turn_boundaries, 0, p1)
                },
                {
                    path: alt.seg_polyline,
                    speed_segments: alt.seg_speed_segments || [],
                    road_segments: alt.seg_road_segments || [],
                    turn_boundaries: alt.seg_turns || []
                },
                {
                    path: slicePathByMileage(currentPath, currentCum, p2, total),
                    speed_segments: clipShiftSegments(meta.speed_segments, p2, total),
                    road_segments: clipShiftSegments(meta.road_segments, p2, total),
                    turn_boundaries: clipShiftTurns(meta.turn_boundaries, p2, total)
                }
            ];
            const replacedSeg = slicePathByMileage(currentPath, currentCum, p1, p2);
            const stopCoords = (trip.route_result.sequence || []).map(s => [s.lat, s.lon]);

            // 向後端請求新路徑重比對 (Re-profile)：重算剖面、leg 距離/基準時間與偵測器覆蓋
            let data = null;
            try {
                const resp = await fetch(`${API_BASE}/api/route/reprofile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pieces: pieces,
                        counties: (trip.vd_result && trip.vd_result.counties) || [],
                        leg_boundaries: meta.leg_boundaries || [],
                        stop_coordinates: stopCoords
                    })
                });
                if (resp.ok) data = await resp.json();
            } catch (err) {
                console.error('新路徑重比對失敗:', err);
            }
            if (!data || data.status !== 'success') {
                alert('套用改道失敗：後端無法重新計算新路線，路線維持不變。');
                return;
            }

            // 備份初始原始路徑（僅在第一次改道時儲存，供清除工具一鍵恢復完整原定計畫）
            if (!trip.originalRoute) {
                trip.originalRoute = {
                    polyline: JSON.parse(JSON.stringify(trip.route_result.polyline || [])),
                    legs: JSON.parse(JSON.stringify(trip.route_result.legs || [])),
                    vd_result: JSON.parse(JSON.stringify(trip.vd_result || {})),
                    route_meta: JSON.parse(JSON.stringify(trip.route_meta || {}))
                };
            }
            trip.replacedSegments = trip.replacedSegments || [];
            if (replacedSeg && replacedSeg.length >= 2) trip.replacedSegments.push(replacedSeg);
            trip.appliedReroutes = trip.appliedReroutes || {};
            trip.appliedReroutes[eventId] = {
                event_id: eventId,
                leg_index: legIndex,
                alt_index: altIndex,
                alt: alt,
                p1_m: p1,
                p2_m: p2
            };

            trip.route_result.polyline = data.polyline;
            trip.vd_result = {
                counties: data.counties,
                points: data.vd_points,
                coverage: data.vd_coverage
            };
            trip.route_meta = data.route_meta;
            // 各 leg 距離與基準時間改由新剖面重算（不再以加減估算）
            (data.legs || []).forEach(nl => {
                const leg = (trip.route_result.legs || [])[nl.leg_index];
                if (!leg) return;
                leg.distance_km = nl.distance_km;
                leg.base_duration_min = nl.base_duration_min;
            });
            const leg = (trip.route_result.legs || [])[legIndex];
            if (leg) leg.base_traffic_status = 'GREEN';
            trip.route_result.distance_km = Math.round((trip.route_result.legs || []).reduce((s, l) => s + (l.distance_km || 0), 0) * 100) / 100;
            applyVdEta(trip);

            // 清空舊改道選項，等待新路況與幾何的持續偵測掃描
            trip.rerouteOptions = [];
            renderSidebar();
            renderAllMapLayers();
            renderTimelineView();

            // 持續動態偵測：以新路況與新幾何持續監控改道
            scheduleRerouteScan(trip);
        }

        function clearAllReroutes() {
            let any = false;
            Object.values(tripStore).forEach(trip => {
                if (!trip.originalRoute || !trip.appliedReroutes || !Object.keys(trip.appliedReroutes).length) return;
                any = true;
                trip.route_result.polyline = JSON.parse(JSON.stringify(trip.originalRoute.polyline));
                if (trip.originalRoute.vd_result) {
                    trip.vd_result = JSON.parse(JSON.stringify(trip.originalRoute.vd_result));
                }
                if (trip.originalRoute.route_meta) {
                    trip.route_meta = JSON.parse(JSON.stringify(trip.originalRoute.route_meta));
                }
                if (trip.originalRoute.legs) {
                    trip.route_result.legs = JSON.parse(JSON.stringify(trip.originalRoute.legs));
                    trip.route_result.distance_km = Math.round(trip.route_result.legs.reduce((s, l) => s + (l.distance_km || 0), 0) * 100) / 100;
                }
                trip.appliedReroutes = {};
                trip.replacedSegments = [];
                trip.originalRoute = null;
                applyVdEta(trip);
            });
            if (!any) return;
            renderSidebar();
            renderAllMapLayers();
            renderTimelineView();
            Object.values(tripStore).forEach(t => { if (t.is_computed && t.route_result) scheduleRerouteScan(t); });
        }

        function renderAllMapLayers() {
            Object.keys(tripLayerGroups).forEach(id => {
                map.removeLayer(tripLayerGroups[id]);
                delete tripLayerGroups[id];
            });
            buildVdPointIndex();

            const allBounds = [];
            Object.values(tripStore).forEach(trip => {
                if (!trip.is_visible) return;

                const layerGroup = L.layerGroup().addTo(map);
                tripLayerGroups[trip.trip_key] = layerGroup;

                if (trip.is_computed && trip.route_result) {
                    if (trip.route_result.polyline && trip.route_result.polyline.length > 0) {
                        L.polyline(trip.route_result.polyline, { color: trip.color, weight: 5, opacity: 0.8 })
                            .on('click', (e) => { L.DomEvent.stopPropagation(e); focusTripInTimeline(trip); })
                            .addTo(layerGroup);
                    }

                    // 改道備選路徑（虛線）與 ETA 標示（僅顯示節省 0.5 分鐘以上，且僅顯示整條路徑節省時間）
                    (trip.rerouteOptions || []).forEach(item => {
                        const typeLabel = rerouteTypeLabel(item);
                        (item.alternatives || []).forEach((alt, ai) => {
                            if (!alt.seg_polyline || alt.seg_polyline.length < 2) return;
                            if (alt.saved_min < 0.5) return;
                            const isComb = item.event_type === 'COMBINED';
                            L.polyline(alt.seg_polyline, {
                                color: '#111111', weight: 5, opacity: 0.65, dashArray: isComb ? '22,8' : '10,8',
                                className: isComb ? 'reroute-flow-comb' : 'reroute-flow'
                            }).addTo(layerGroup)
                                .bindTooltip(`Leg ${item.leg_index + 1}｜${typeLabel} 備選${ai + 1}：整趟省 ${alt.saved_min.toFixed(1)} 分（${item.current_eta_min} → ${alt.eta_min} 分）`, { sticky: true });
                            const midPt = alt.seg_polyline[Math.floor(alt.seg_polyline.length / 2)];
                            if (midPt) {
                                const colorHexMap = {
                                    'GREEN': '#16a34a',
                                    'ORANGE': '#ea580c',
                                    'RED': '#dc2626',
                                    'GRAY': '#94a3b8'
                                };
                                const rtColorHex = colorHexMap[alt.realtime_color] || '#94a3b8';
                                                                let rtRowHtml = '';
                                if (alt.has_vd_coverage && alt.realtime_saved_min != null) {
                                    const isSlower = alt.realtime_saved_min < 0;
                                    const minVal = Math.abs(alt.realtime_saved_min).toFixed(1);
                                    const timeStr = isSlower ? `即時慢 ${minVal}分` : `即時省 ${minVal}分`;
                                    rtRowHtml = `<div class="alt-eta-row" style="margin-left: 12px;"><span>${timeStr}</span><span class="alt-eta-sq" style="background:${rtColorHex};"></span></div>`;
                                } else {
                                    const anomText = alt.anomaly_tag ? alt.anomaly_tag : '無覆蓋';
                                    rtRowHtml = `<div class="alt-eta-row" style="margin-left: 12px; color:#64748b;"><span>${anomText}</span><span class="alt-eta-sq" style="background:#94a3b8;"></span></div>`;
                                }
                                                                const badgeHtml = `<div class="alt-eta-badge" onclick="toggleAltEtaBadge(this, event)" title="點擊展開/收起詳情">
                                    <div class="alt-eta-collapsed-dot" style="background:${trip.color};"></div>
                                    <div class="alt-eta-expanded-body">
                                        <div class="alt-eta-row" style="color:#7c3aed; font-weight:700;"><span>${typeLabel}</span></div>
                                        <div class="alt-eta-row">
                                            <span class="alt-eta-dot" style="background:${trip.color};"></span>
                                            <span>省 ${alt.saved_min.toFixed(1)}分 (預估)</span>
                                        </div>
                                        ${rtRowHtml}
                                    </div>
                                </div>`;
                                L.marker(midPt, {
                                    icon: L.divIcon({ className: '', html: badgeHtml, iconSize: null, iconAnchor: [9, 9] }),
                                    interactive: true
                                }).addTo(layerGroup);
                            }
                            if (alt.exit_at) {
                                L.circleMarker(alt.exit_at, { radius: 6, color: '#111111', fillColor: '#ffffff', fillOpacity: 1, weight: 3 })
                                    .bindTooltip('建議提早改道點').addTo(layerGroup);
                            }
                            if (alt.rejoin_at) {
                                L.circleMarker(alt.rejoin_at, { radius: 6, color: '#111111', fillColor: '#666666', fillOpacity: 0.6, weight: 3 })
                                    .bindTooltip('建議回歸點').addTo(layerGroup);
                            }
                        });
                    });
                    if (trip.route_result.sequence) {
                        trip.route_result.sequence.forEach(seqStop => {
                            if (seqStop.type === 'DEPOT') return;
                            const labelText = seqStop.is_merged ? `#${seqStop.seq_no} (${seqStop.merged_count}單)` : `#${seqStop.seq_no}`;
                            const seqLabelIcon = L.divIcon({
                                className: 'stop-label-icon',
                                html: `<span class="stop-seq-label" style="background:${trip.color};">${labelText}</span>`,
                                iconSize: [36, 20],
                                iconAnchor: [18, -6]
                            });
                            L.marker([seqStop.lat, seqStop.lon], { icon: seqLabelIcon })
                                .on('click', (e) => { L.DomEvent.stopPropagation(e); focusTripInTimeline(trip); })
                                .addTo(layerGroup);
                        });
                    }

                    // VD 覆蓋段（由後端 reprofile 動態更新後的原生覆蓋資料繪製）
                    if (trip.vd_result) {
                        (trip.vd_result.coverage || []).forEach(cov => {
                            const eff = effectiveVd(cov.vdid, cov.dir_links);
                            const baseColor = VD_COLORS[eff.color] || VD_COLORS.GRAY;
                            L.polyline(cov.path, {
                                color: baseColor, weight: 8, opacity: 0.85, lineCap: 'round',
                                pane: 'vdCoveragePane'
                            }).addTo(layerGroup);
                            if (eff.color !== 'GRAY') {
                                L.polyline(cov.path, {
                                    color: VD_COLORS.GRAY, weight: 8, opacity: 0.9,
                                    className: 'vd-flow', lineCap: 'round',
                                    pane: 'vdCoveragePane'
                                }).addTo(layerGroup);
                            }
                        });
                    }
                }

                trip.stops.forEach(stop => {
                    const isCancelled = stop.status === 'CANCELLED';
                    const markerColor = isCancelled ? '#94a3b8' : trip.color;
                    const marker = L.circleMarker([stop.lat, stop.lon], {
                        radius: 6, fillColor: markerColor, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: isCancelled ? 0.3 : 0.9,
                        pane: 'stopMarkerPane'
                    });
                    marker.bindPopup(() => createStopPopupContent(stop, trip));
                    marker.on('click', () => focusTripInTimeline(trip));
                    marker.addTo(layerGroup);
                    allBounds.push([stop.lat, stop.lon]);
                });
            });

            renderVdLayer();

            if (allBounds.length > 0) map.fitBounds(L.latLngBounds(allBounds).pad(0.08));
            renderRerouteArrows();
        }

        function renderVdLayer() {
            vdLayerGroup.clearLayers();
            buildVdPointIndex();
            const byVdid = new Map();
            Object.values(tripStore).forEach(trip => {
                if (!trip.is_computed || !trip.vd_result) return;
                (trip.vd_result.points || []).forEach(pt => {
                    const cur = byVdid.get(pt.vdid);
                    if (cur) {
                        if (!cur.on_route && pt.on_route) cur.dir_links = pt.dir_links;
                        cur.on_route = cur.on_route || pt.on_route;
                        cur.dir_mismatch = cur.dir_mismatch || pt.dir_mismatch;
                        if (cur.levels == null && pt.levels != null) cur.levels = pt.levels;
                    } else {
                        byVdid.set(pt.vdid, Object.assign({}, pt));
                    }
                });
            });
            // 在路線上的偵測器：依各車次覆蓋段的行進方向取最嚴重的有效狀態
            const routeEff = new Map();
            Object.values(tripStore).forEach(trip => {
                if (!trip.is_computed || !trip.vd_result) return;
                (trip.vd_result.coverage || []).forEach(cov => {
                    const eff = effectiveVd(cov.vdid, cov.dir_links);
                    const cur = routeEff.get(cov.vdid);
                    if (!cur || (VD_COLOR_SEVERITY[eff.color] || 0) > (VD_COLOR_SEVERITY[cur.color] || 0)) routeEff.set(cov.vdid, eff);
                });
            });

            byVdid.forEach(pt => {
                if (!showUncoveredVd && !pt.on_route) return;
                // 不在路線上：取各方向中較慢者
                let eff = routeEff.get(pt.vdid);
                if (!eff) {
                    eff = { level: null, color: 'GRAY', speed: 0, manual: false };
                    vdDirectionList(pt).forEach(d => {
                        const r = d.reading;
                        if (r.speed == null) return;
                        if (eff.speed === 0 || (r.level || 0) > (eff.level || 0) || ((r.level || 0) === (eff.level || 0) && r.speed < eff.speed)) {
                            eff = { level: r.level, color: r.color, speed: r.speed, manual: false };
                        }
                    });
                    if (vdManualOverride[pt.vdid] != null) eff = effectiveVd(pt.vdid);
                }
                const iconColor = pt.on_route ? (VD_COLORS[eff.color] || VD_COLORS.GRAY)
                    : (eff.speed > 0 ? (VD_COLORS[eff.color] || VD_WARN_COLOR) : VD_WARN_COLOR);
                const routeLinks = new Set(pt.on_route ? (pt.dir_links || []) : []);
                const dirRows = vdDirectionList(pt).map(d => {
                    const r = d.reading;
                    const label = BEARING_LABEL[d.bearing] || (d.bearing || '未知方向');
                    const val = (r.speed != null) ? `${r.speed} km/h（${vdLevelLabel(r.level)}）`
                        : `<span style="color:#d9534f;">${r.anomaly || '無資料'}，不納入計算</span>`;
                    const mark = routeLinks.has(d.lid) ? ' <span style="color:#0284c7;">◀ 路線方向</span>' : '';
                    return `<div class="prop-item" style="padding-left:8px;">${label}：<b>${val}</b>${mark}</div>`;
                }).join('');
                const speedBlock = dirRows || `<div class="prop-item" style="padding-left:8px;">無即時資料</div>`;
                const statusTxt = (pt.status === 0 || pt.status === '0') ? '正常' : (pt.status == null ? '無即時資料' : `異常 (${pt.status})`);
                const timeTxt = pt.collect_time ? String(pt.collect_time).replace('T', ' ').slice(0, 19) : '—';
                const routeTxt = pt.on_route ? '是（沿線滾動顯示）' : (pt.dir_mismatch ? '否（僅量測對向車道）' : '否');
                const levelTxt = (eff.level != null) ? `${vdLevelLabel(eff.level)}` : '無資料';
                const levelTitle = pt.on_route ? '路線方向壅塞等級' : '壅塞等級（較慢方向）';
                const simTxt = vdManualOverride[pt.vdid] != null
                    ? `<div class="prop-item">模擬: <b>${vdLevelLabel(vdManualOverride[pt.vdid])}</b>（即時優先）</div>` : '';

                let html = `<div class="stop-popup"><div class="stop-popup-title">VD ${pt.vdid}</div>`
                    + `<div class="prop-item">路段: <b>${pt.road || '未知路段'}</b></div>`
                    + `<div class="prop-item">即時速度（依方向）:</div>` + speedBlock
                    + `<div class="prop-item">${levelTitle}: <b>${levelTxt}</b></div>`
                    + simTxt
                    + `<div class="prop-item">狀態: ${statusTxt}</div>`
                    + `<div class="prop-item">更新時間: ${timeTxt}</div>`
                    + `<div class="prop-item">是否在路線上: ${routeTxt}</div>`;

                if (pt.on_route) {
                    const sim = vdManualOverride[pt.vdid];
                    const labels = ['A', 'B', 'C', 'D', 'E'];
                    const btns = labels.map((lb, i) => {
                        const lv = i + 1;
                        return `<button class="vd-sim-btn${sim === lv ? ' active' : ''}" data-vd="${pt.vdid}" data-lv="${lv}">${lb}</button>`;
                    }).join('');
                    html += `<div class="prop-item" style="margin-top:6px;">模擬壅塞（即時優先）:</div>`
                        + `<div class="vd-sim-row">${btns}<button class="vd-sim-btn" data-vd="${pt.vdid}" data-lv="0">清除</button></div>`;
                }
                html += `</div>`;

                L.marker([pt.lat, pt.lon], { icon: makeVdWarnIcon(pt.on_route, iconColor, eff.manual) })
                    .bindPopup(html)
                    .addTo(vdLayerGroup);
            });
        }

            if (stop.item_name) dynamicProps.push(`<div class="prop-item">品名: <b>${stop.item_name}</b></div>`);
            if (stop.weight_kg) dynamicProps.push(`<div class="prop-item">重量: <b>${stop.weight_kg} kg</b></div>`);
            if (stop.volume_cbm) dynamicProps.push(`<div class="prop-item">材積: <b>${stop.volume_cbm} cbm</b></div>`);

        /* ========== 綠色框：行程時間系統時序視圖 ========== */

        let timelineComputedTrips = [];

            const menu = document.getElementById('timeline-trip-menu');

            menu.classList.toggle('open', open);

            updateTimelineTripOptions();
            renderTimelineView();
        }

        function flyMapToStation(lat, lon) {
            if (lat == null || lon == null) return;
            map.flyTo([lat, lon], 17, { duration: 0.7 });
        }

        function focusTripInTimeline(trip) {
            if (!trip || !trip.is_computed || !trip.route_result) return;
            switchTab('timeline');
            timelineSelectedTripKey = trip.trip_key;
            toggleTripSelectMenu(false);
            updateTimelineTripOptions();
            renderTimelineView();

        function updateTimelineTripOptions() {
            const menu = document.getElementById('timeline-trip-menu');
            const labelEl = document.getElementById('timeline-trip-label');
            const dotEl = document.getElementById('timeline-trip-dot');
            if (!menu) return;

            timelineComputedTrips = Object.values(tripStore).filter(t => t.is_computed && t.route_result);

            if (timelineComputedTrips.length === 0) {
                timelineSelectedTripKey = '';
                menu.innerHTML = '';
                labelEl.innerText = '尚無已計算車次';
                dotEl.style.background = 'transparent';
                return;
            }

            if (!timelineComputedTrips.some(t => t.trip_key === timelineSelectedTripKey)) {
                timelineSelectedTripKey = timelineComputedTrips[0].trip_key;
            }

            menu.innerHTML = timelineComputedTrips.map((t, i) => {
                const stationCount = t.route_result.sequence ? t.route_result.sequence.length - 1 : 0;
                const active = t.trip_key === timelineSelectedTripKey ? 'active' : '';
                return `<div class="trip-select-option ${active}" onclick="selectTimelineTrip(${i})">

                    <span class="trip-select-label">[${t.date}] ${t.order_id} (${stationCount} 站)</span>

            labelEl.innerText = `[${cur.date}] ${cur.order_id} (${cur.route_result.sequence.length - 1} 站)`;

                if (index < legs.length) {
                    const leg = legs[index];
                    const arrowEl = document.createElement('div');
                    const statusClass = leg.traffic_status === 'RED' ? 'red'

                    arrowEl.className = `timeline-arrow-wrap ${statusClass}`.trim();
                    arrowEl.innerHTML = `
                        <div class="timeline-arrow-line"></div>

                    // 改道面板（包含有效省時改道建議，以及壅塞時未改道之原因提示）

                    const legApplied = Object.values(trip.appliedReroutes || {}).filter(ap => ap.leg_index === index);
                    const suggestItems = legItems.filter(x => x.state === 'CAN_REROUTE' && x.alternatives && x.alternatives.some(a => a.saved_min >= 0.5));
                    const noItems = legItems.filter(x => x.state === 'CANNOT_REROUTE' || (x.state === 'CAN_REROUTE' && (!x.alternatives || !x.alternatives.length)));

                    const bestItem = suggestItems.length
                        ? suggestItems.reduce((a, b) => {
                            const ea = Math.min(...a.alternatives.map(t => t.eta_min || 0));
                            const eb = Math.min(...b.alternatives.map(t => t.eta_min || 0));
                            return ea <= eb ? a : b;
                        })
                        : null;
                    if (bestItem) {
                        // 有建議路徑：原箭頭資訊不變但稍左移，右側併排一條螢光黃改道箭頭
                        const validAlts = bestItem.alternatives.filter(a => a.saved_min >= 0.5);
                        const bestAlt = (validAlts.length ? validAlts : bestItem.alternatives).reduce((a, b) => ((a.eta_min || 0) <= (b.eta_min || 0) ? a : b));
                        const duo = document.createElement('div');
                        duo.className = 'timeline-arrow-duo';
                        arrowEl.classList.add('shifted');
                        duo.appendChild(arrowEl);

                        rrArrow.className = 'timeline-arrow-wrap reroute';

                    // 1. 已套用改道面板
                                        legApplied.forEach(ap => {

                        if (alt.has_vd_coverage && alt.realtime_saved_min != null) {

                    suggestItems.forEach(item => {

                                if (isSlower) {
                                    primaryText = `<span style="color:#b91c1c; font-weight:700;">備選 ${ai + 1}：即時慢 ${minVal} 分</span> <span class="alt-eta-sq" style="background:${rtColorHex};"></span>`;
                                    secondaryText = `預估省 ${alt.saved_min.toFixed(1)} 分（即時路況較塞，套用前請評估）`;

                                    secondaryText = `預估省 ${alt.saved_min.toFixed(1)} 分（基準速限時間）`;

                                <button class="reroute-apply-btn" data-trip="${trip.trip_key}" data-event="${item.event_id}" data-alt="${ai}" style="margin-top:2px; ${btnStyle}">套用</button>

                    if (!suggestItems.length) {
